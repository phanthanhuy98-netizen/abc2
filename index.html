                </button>
            </div>
        </div>
    `;
    modalContainer.classList.remove('hidden');
};

window.executeMonthlyClone = async function(srcMonth, destMonth) {
    const multiplier = Number(document.getElementById('monthlyCloneMultiplier').value) || 0;
    const ratio = 1 + (multiplier / 100);

    const btn = document.getElementById('btnConfirmMonthlyClone');
    if(btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG NHÂN BẢN HÀNG LOẠT...';
    }

    try {
        const targetsSnap = await getDocs(collection(db, "monthlyTargets"));
        const batch = writeBatch(db);
        let clonedCount = 0;
        const nowISO = new Date().toISOString();

        targetsSnap.forEach(docSnap => {
            const data = docSnap.data();
            if (data && data.month === srcMonth) {
                const sCode = data.salesCode;
               const safeCode = sCode.replace(/[\/\\]/g, '_');
const destDocId = `tgt_${safeCode}_${destMonth}`;
                const destRef = doc(db, "monthlyTargets", destDocId);

                let scaledItems = (data.items || []).map(item => ({
                    ...item,
                    target: Math.round(item.target * ratio),
                    createdByUid: currentUser.uid,
                    createdByRole: currentUser.role
                }));

                let scaledRevenues = {};
                const sourceRevenues = data.companyRevenues || {};
                for (let comp in sourceRevenues) {
                    scaledRevenues[comp] = {
                        ...sourceRevenues[comp],
                        target: Math.round(sourceRevenues[comp].target * ratio)
                    };
                }

                batch.set(destRef, {
                    salesCode: sCode,
                    month: destMonth,
                    items: scaledItems,
                    companyRevenues: scaledRevenues,
                    lastUpdatedByCode: currentUser.code,
                    lastUpdatedByName: currentUser.name,
                    lastUpdatedAt: nowISO
                }, { merge: true });

                clonedCount++;
            }
        });

        if (clonedCount === 0) {
            if(btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-bolt"></i> XÁC NHẬN NHÂN BẢN'; }
            return alert(`Không tìm thấy dữ liệu KPI nào trong tháng ${srcMonth} để nhân bản!`);
        }

        await batch.commit();
        closeTargetModal();
        if (typeof playSystemSound === 'function') playSystemSound('success');
        
        // Tự động chuyển màn hình sang tháng mới vừa nhân bản để xem kết quả
        window._chiTieuTargetMonth = destMonth;
        alert(`✅ Đã nhân bản thành công KPI của ${clonedCount} nhân viên sang tháng ${destMonth}!`);
        calculateAndRenderTargets();

    } catch (e) {
        if(btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-bolt"></i> XÁC NHẬN NHÂN BẢN'; }
        alert("Lỗi nhân bản hàng loạt: " + e.message);
    }
};
window.exportKpiExcel = async function() {
    const rawMonth = window._chiTieuTargetMonth; // Lấy tháng dạng "2026-09"
    let formattedMonth = rawMonth;
    if (rawMonth && rawMonth.includes('-')) {
        const parts = rawMonth.split('-'); 
        formattedMonth = `${parts[1]}/${parts[0]}`; // Chuyển thành "09/2026"
    }

    const targetSalesCode = window._chiTieuTargetSalesCode; 
    
    const btn = document.querySelector('button[onclick="exportKpiExcel()"]');
    if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG TỔNG HỢP...';
    }

    try {
        let allSalesToExport = [];
        if (!targetSalesCode || targetSalesCode === 'ALL') {
            allSalesToExport = users.filter(u => u.role === 'sales' && u.active !== false);
        } else {
            allSalesToExport = users.filter(u => u.code === targetSalesCode);
        }

        if (allSalesToExport.length === 0) {
            throw new Error("Không tìm thấy nhân viên Sales nào để xuất báo cáo!");
        }

        let rawExportRows = [];
        let grandTargetQty = 0, grandActualQty = 0, grandTargetRev = 0, grandActualRev = 0;

        for (const salesUser of allSalesToExport) {
            const sCode = salesUser.code;
            const sName = salesUser.name;

          const safeCode = sCode.replace(/[\/\\]/g, '_');
const targetDocId = `tgt_${safeCode}_${rawMonth}`;
            const targetRef = doc(db, "monthlyTargets", targetDocId);
            const tSnap = await getDoc(targetRef);

            let userTargets = {}; 
            let compRevenueTargets = {};

            if (tSnap.exists()) {
                const data = tSnap.data();
                const items = data.items || [];
                compRevenueTargets = data.companyRevenues || {};

                items.forEach(it => {
                    const pObj = products.find(p => p.id === it.skuCode || p.code === it.skuCode);
                    const ratio = Number(pObj?.tyLeQuyDoi || 50);
                    const price = Number(pObj?.price || 0);
                    userTargets[it.skuCode] = {
                        targetQty: Number(it.target || 0),
                        targetRev: Number(it.target || 0) * ratio * price,
                        skuName: it.skuName || it.skuCode
                    };
                });
            }

            let userActuals = {}; 
            let compActualRevenues = {};

            orders.forEach(o => {
                if (o.status !== 'Đã hủy' && o.ngayCtu && o.ngayCtu.startsWith(rawMonth) && o.salesCode === sCode) {
                    if (Array.isArray(o.items)) {
                        o.items.forEach(item => {
                            const pObj = products.find(p => p.id === (item.id||item.code) || p.code === (item.id||item.code));
                            const ratio = Number(pObj?.tyLeQuyDoi || item.tyLeQuyDoi || 50);
                            const price = Number(item.price || pObj?.price || 0);
                            const qtyThung = Number(item.qty || 0) / (ratio > 0 ? ratio : 50);
                            const rev = Number(item.qty || 0) * price;
                            const skuKey = String(item.code || item.id || '').toUpperCase();

                            const compCode = getCompCodeFromProductCode(skuKey);
                            compActualRevenues[compCode] = (compActualRevenues[compCode] || 0) + rev;

                            if (!userActuals[skuKey]) {
                                userActuals[skuKey] = { actualQty: 0, actualRev: 0, skuName: item.name || skuKey };
                            }
                            userActuals[skuKey].actualQty += qtyThung;
                            userActuals[skuKey].actualRev += rev;
                        });
                    }
                }
            });

            let allComps = new Set([...Object.keys(compRevenueTargets), ...Object.keys(compActualRevenues)]);
            allComps.forEach(compCode => {
                const cTargetObj = compRevenueTargets[compCode] || { target: 0, compName: compCode };
                const tRev = Number(cTargetObj.target || 0);
                const aRev = Number(compActualRevenues[compCode] || 0);

                if (tRev === 0 && aRev === 0) return;

                let foundComp = companyList.find(c => String(c.maCtu||'').toUpperCase() === String(compCode).toUpperCase());
                let cName = foundComp ? foundComp.tenCtu : (cTargetObj.compName || compCode);

                let pctText = '0%';
                if (tRev > 0) {
                    pctText = ((aRev / tRev) * 100).toFixed(1) + '%';
                } else if (tRev === 0 && aRev > 0) {
                    pctText = 'Vượt mức';
                }

                grandTargetRev += tRev;
                grandActualRev += aRev;

                rawExportRows.push({
                    "Mã NV": sCode,
                    "Tên Nhân Viên": sName,
                    "Tháng KPI": formattedMonth,
                    "Tên Công Ty": cName,
                    "Mã Sản Phẩm": "[DOANH SỐ TỔNG CTY]",
                    "Tên Sản Phẩm": `Mục tiêu doanh số công ty ${compCode}`,
                    "Chỉ Tiêu (Thùng)": 0,
                    "Thực Đạt (Thùng)": 0,
                    "Tiến Độ (%)": pctText,
                    "Chỉ Tiêu (VNĐ)": tRev.toLocaleString('en-US'),
                    "Thực Đạt (VNĐ)": aRev.toLocaleString('en-US'),
                    _sortRev: aRev
                });
            });

            let mergedSkus = new Set([...Object.keys(userTargets), ...Object.keys(userActuals)]);
            mergedSkus.forEach(skuKey => {
                const t = userTargets[skuKey] || { targetQty: 0, targetRev: 0, skuName: '' };
                const a = userActuals[skuKey] || { actualQty: 0, actualRev: 0, skuName: '' };

                const tQty = t.targetQty; const aQty = a.actualQty;
                const tRev = t.targetRev; const aRev = a.actualRev;

                if (tQty === 0 && aQty === 0) return; 

                let cCode = getCompCodeFromProductCode(skuKey);
                let foundComp = companyList.find(c => String(c.maCtu||'').toUpperCase() === String(cCode).toUpperCase());
                let cName = foundComp ? foundComp.tenCtu : cCode;
                let sNameFull = t.skuName || a.skuName || skuKey;

                let pctText = '0%';
                if (tQty > 0) {
                    pctText = ((aQty / tQty) * 100).toFixed(1) + '%';
                } else if (tQty === 0 && aQty > 0) {
                    pctText = 'Vượt mức (Không giao KPI)';
                }

                const formatNum = (num) => Number.isInteger(Number(num)) ? Number(num) : Number(Number(num).toFixed(2));

                grandTargetQty += tQty;
                grandActualQty += aQty;
                grandTargetRev += tRev;
                grandActualRev += aRev;

                rawExportRows.push({
                    "Mã NV": sCode,
                    "Tên Nhân Viên": sName,
                    "Tháng KPI": formattedMonth,
                    "Tên Công Ty": cName,
                    "Mã Sản Phẩm": skuKey,
                    "Tên Sản Phẩm": sNameFull,
                    "Chỉ Tiêu (Thùng)": formatNum(tQty),
                    "Thực Đạt (Thùng)": formatNum(aQty),
                    "Tiến Độ (%)": pctText,
                    "Chỉ Tiêu (VNĐ)": tRev.toLocaleString('en-US'),
                    "Thực Đạt (VNĐ)": aRev.toLocaleString('en-US'),
                    _sortRev: aRev
                });
            });
        }

        if (rawExportRows.length === 0) {
            throw new Error("Tháng này chưa có chỉ tiêu hoặc dữ liệu bán hàng nào để xuất báo cáo!");
        }

        rawExportRows.sort((a,b) => b._sortRev - a._sortRev);
        
        let exportData = rawExportRows.map(row => {
            let cleanRow = { ...row };
            delete cleanRow._sortRev; 
            return cleanRow;
        });

        let totalPctText = '0%';
        if (grandTargetRev > 0) {
            totalPctText = ((grandActualRev / grandTargetRev) * 100).toFixed(1) + '%';
        } else if (grandTargetRev === 0 && grandActualRev > 0) {
            totalPctText = 'Vượt mức';
        }

        exportData.push({
            "Mã NV": "",
            "Tên Nhân Viên": "TỔNG CỘNG TOÀN CÔNG TY",
            "Tháng KPI": "",

window.openTargetModal = async function() {

    const modalContainer = document.getElementById('dynamicModalContainer');

    const targetsSnap = await getDocs(collection(db, "monthlyTargets"));
    let hasExisting = false;
    targetsSnap.forEach(docSnap => {
        const data = docSnap.data();
        if (data && data.month === window._chiTieuTargetMonth) {
            hasExisting = true;
        }
    });

    // Nếu đã có KPI, đưa ra cảnh báo chặn lại để tránh ghi đè làm mất dữ liệu
    if (hasExisting) {
        // Phải ẩn modal loading trước khi show popup confirm
        if (modalContainer) {
            modalContainer.innerHTML = '';
            modalContainer.classList.add('hidden');
        }
        const confirmEdit = await window.showCustomConfirm(
            "THÁNG NÀY ĐÃ CÓ CHỈ TIÊU",
            `Tháng ${window._chiTieuTargetMonth} đã được thiết lập KPI rồi.\n\nNếu bạn "Thiết lập mới", toàn bộ số cũ sẽ bị xóa sổ. Bạn có muốn chuyển sang chế độ XEM & SỬA không?`,

        );
        
        // Nếu chọn "Đồng ý", chuyển hướng gọi thẳng hàm Edit
        if (confirmEdit) {
            return loadAndEditCurrentMonthKpi();
        } 
        // Nếu chọn "Hủy bỏ", dừng lại luôn
        return; 
    }
    
    // 2. KHỞI TẠO BÌNH THƯỜNG NẾU THÁNG ĐÓ CHƯA CÓ KPI
    // Mặc định chọn tất cả Sales đang hoạt động
    const activeSalesCodes = (typeof users !== 'undefined' ? users : [])
                              .filter(u => u.role === 'sales' && u.active !== false)
                              .map(u => u.code);

        companies: [], 
        selectedSalesCodes: activeSalesCodes, 
        salesAllocations: { initialized: false }

    // Không cần ẩn Modal Loading vì renderMasterKpiStep1 sẽ tự động ghi đè giao diện Bước 1 lên
    renderMasterKpiStep1();
    
  } catch (error) {
    // Nếu có lỗi cũng phải tắt màn hình loading đi
    const modalContainer = document.getElementById('dynamicModalContainer');
    if (modalContainer) {
        modalContainer.innerHTML = '';
        modalContainer.classList.add('hidden');

    alert("Lỗi khi mở form thiết lập: " + error.message);

window.toggleKpiSales = function(code, isChecked) {
    if (isChecked) {
        if (!window._masterKpiState.selectedSalesCodes.includes(code)) {
            window._masterKpiState.selectedSalesCodes.push(code);
        }
    } else {
        window._masterKpiState.selectedSalesCodes = window._masterKpiState.selectedSalesCodes.filter(c => c !== code);
    }

    const row = document.getElementById(`row_sales_${code}`);
    const cb = document.getElementById(`cb_sales_${code}`);
    
    if (cb) cb.checked = isChecked;
    if (row) {
        if (isChecked) row.classList.add('selected');
        else row.classList.remove('selected');
    }

    const countEl = document.getElementById('mkpi_selected_sales_count');
    if (countEl) countEl.innerText = window._masterKpiState.selectedSalesCodes.length;
    
    // Tự động kiểm tra checkbox "Chọn hết"
    const allSalesLen = (typeof users !== 'undefined' ? users : []).filter(u => u.role === 'sales' && u.active !== false).length;
    const cbAll = document.getElementById('cb_all_sales');
    if (cbAll) cbAll.checked = window._masterKpiState.selectedSalesCodes.length === allSalesLen;
};

window.toggleAllKpiSales = function(selectAll) {
    const salesUsers = typeof users !== 'undefined' ? users.filter(u => u.role === 'sales' && u.active !== false) : [];

    if (selectAll) {
        window._masterKpiState.selectedSalesCodes = salesUsers.map(u => u.code);
    } else {
        window._masterKpiState.selectedSalesCodes = [];
    }

    salesUsers.forEach(u => {
        const row = document.getElementById(`row_sales_${u.code}`);
        const cb = document.getElementById(`cb_sales_${u.code}`);
        if (cb) cb.checked = selectAll;
        if (row) {
            if (selectAll) row.classList.add('selected');
            else row.classList.remove('selected');
        }
    });

    const countEl = document.getElementById('mkpi_selected_sales_count');
    if (countEl) countEl.innerText = window._masterKpiState.selectedSalesCodes.length;
};
window.loadAndEditCurrentMonthKpi = async function() {
    if (!currentUser || (currentUser.role !== 'admin' && currentUser.role !== 'manager')) return;

    const modalContainer = document.getElementById('dynamicModalContainer');
    if (modalContainer) {
        modalContainer.innerHTML = `<div class="modal" style="display:flex; z-index:999999;"><div style="color:#fff; font-size:18px; font-weight:bold;"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu thiết lập kỳ này...</div></div>`;
        modalContainer.classList.remove('hidden');
    }

    try {
        const targetsSnap = await getDocs(collection(db, "monthlyTargets"));
        let foundDocs = [];
        targetsSnap.forEach(docSnap => {
            const data = docSnap.data();
            if (data && data.month === window._chiTieuTargetMonth) {
                foundDocs.push(data);
            }
        });

        if (foundDocs.length === 0) {
            if (modalContainer) modalContainer.classList.add('hidden');
            return alert(`Tháng ${window._chiTieuTargetMonth} chưa có thiết lập chỉ tiêu nào. Vui lòng bấm "THIẾT LẬP MỚI".`);
        }

        let totalTarget = 0;
        let compMap = {}; 
        let alloc = { initialized: true };

        const salesUsers = typeof users !== 'undefined' ? users.filter(u => u.role === 'sales' && u.active !== false) : [];
        salesUsers.forEach(s => {
            alloc[s.code] = { name: s.name, companies: {}, skus: {} };
        });

        // Bóc tách dữ liệu từ Firebase
        foundDocs.forEach(data => {
            const sCode = data.salesCode;
            if (!alloc[sCode]) alloc[sCode] = { name: sCode, companies: {}, skus: {} };

            // Bóc tách tiền Công ty
            const revs = data.companyRevenues || {};
            Object.keys(revs).forEach(cCode => {
                const t = Number(revs[cCode].target || 0);
                alloc[sCode].companies[cCode] = t;

                if (!compMap[cCode]) compMap[cCode] = { compName: revs[cCode].compName || cCode, target: 0, skusMap: {} };
                compMap[cCode].target += t;
                totalTarget += t;
            });

            // Bóc tách sản lượng SKU
            const items = data.items || [];
            items.forEach(it => {
                const cCode = it.compCode || 'KHAC';
                const sku = it.skuCode;
                const t = Number(it.target || 0);

                alloc[sCode].skus[sku] = t;

                if (!compMap[cCode]) compMap[cCode] = { compName: it.compName || cCode, target: 0, skusMap: {} };
                if (!compMap[cCode].skusMap[sku]) compMap[cCode].skusMap[sku] = { skuName: it.skuName || sku, qty: 0 };
                compMap[cCode].skusMap[sku].qty += t;
            });
        });

        // Đóng gói mảng giao diện Bước 1
        // Đóng gói mảng giao diện Bước 1
        let companies = [];
        Object.keys(compMap).forEach(cCode => {
            const c = compMap[cCode];
            let focusSkus = [];
            Object.keys(c.skusMap).forEach(sku => {
                focusSkus.push({ skuCode: sku, skuName: c.skusMap[sku].skuName, qty: c.skusMap[sku].qty });
            });
            companies.push({ compCode: cCode, compName: c.compName, target: c.target, focusSkus });
        });

        // Lấy danh sách những NV đã được giao số trong bảng dữ liệu cũ
        const loadedSalesCodes = new Set(foundDocs.map(d => d.salesCode));

        window._masterKpiState = { 
            totalTarget, 
            companies, 
            selectedSalesCodes: Array.from(loadedSalesCodes), // THÊM DÒNG NÀY
            salesAllocations: alloc 
        };
        renderMasterKpiStep1();

    } catch (err) {
        if (modalContainer) modalContainer.classList.add('hidden');
        alert("Lỗi tải dữ liệu: " + err.message);
    }
};

// ================= HÀM XỬ LÝ TÌM KIẾM CÔNG TY THÔNG MINH =================
window.searchMkpiComp = function(keyword) {
  const q = typeof removeAccents === 'function' ? removeAccents(keyword.trim().toLowerCase()) : keyword.trim().toLowerCase();
  const resEl = document.getElementById('mkpi_search_comp_res');
  if (!resEl) return;

  if (!q) { 
      resEl.classList.add('hidden'); 
      return; 
  }
  
  const matched = (typeof companyList !== 'undefined' ? companyList : []).filter(c => {
      const txt = typeof removeAccents === 'function' ? removeAccents(`${c.maCtu} ${c.tenCtu}`).toLowerCase() : `${c.maCtu} ${c.tenCtu}`.toLowerCase();
      return txt.includes(q);
  }).slice(0, 15);

  if (matched.length > 0) {
      resEl.innerHTML = matched.map(c => `
          <div onclick="addMkpiComp('${c.maCtu}', '${(c.tenCtu||'').replace(/'/g, "\\'")}')" 
               style="padding:12px 14px; border-bottom:1px solid var(--card-border); cursor:pointer; font-size:14px; font-weight:800; transition:0.2s;"
               onmouseover="this.style.background='rgba(37,99,235,0.05)'" onmouseout="this.style.background='transparent'">
              <span style="color:var(--amber);">[${c.maCtu}]</span> ${c.tenCtu}
          </div>
      `).join('');
      resEl.classList.remove('hidden');
  } else {
      resEl.innerHTML = '<div style="padding:14px; color:var(--text-muted); font-size:13px; font-style:italic; text-align:center;">Không tìm thấy công ty phù hợp.</div>';
      resEl.classList.remove('hidden');
  }
};

window.addMkpiComp = function(maCtu, tenCtu) {
  if (window._masterKpiState.companies.find(c => c.compCode === maCtu)) return alert("Đã thêm công ty này rồi!");
  window._masterKpiState.companies.push({ compCode: maCtu, compName: tenCtu, target: 0, focusSkus: [] });
  
  const scrollArea = document.querySelector('.modal-content > div:nth-child(2)');
  const currentScrollTop = scrollArea ? scrollArea.scrollTop : 0;
  
  renderMasterKpiStep1();
  
  setTimeout(() => {
      const newScrollArea = document.querySelector('.modal-content > div:nth-child(2)');
      if (newScrollArea) newScrollArea.scrollTop = currentScrollTop;
  }, 0);
};

window.removeKpiCompany = function(idx) { 
  window._masterKpiState.companies.splice(idx, 1); 
  
  const scrollArea = document.querySelector('.modal-content > div:nth-child(2)');
  const currentScrollTop = scrollArea ? scrollArea.scrollTop : 0;
  
  renderMasterKpiStep1();
  
  setTimeout(() => {

      if (newScrollArea) newScrollArea.scrollTop = currentScrollTop;
  }, 0);
};

// Hàm xử lý định dạng cho ô: 1. TỔNG DOANH SỐ CẦN GIAO THÁNG NÀY
window.handleMkpiTotalInput = function() {
    const el = document.getElementById('mkpi_total');
    if (!el) return;
    
    // Lưu lại vị trí con trỏ chuột
    let cursor = el.selectionStart;
    let oldLen = el.value.length;
    
    // Lọc lấy số thuần túy
    let clean = String(el.value).replace(/[^0-9]/g, '');
    window._masterKpiState.totalTarget = Number(clean) || 0;
    
    // Ép cứng định dạng phân cách hàng nghìn bằng dấu CHẤM (.)
    el.value = clean.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    
    // Trả lại vị trí con trỏ chuột để gõ không bị giật
    el.setSelectionRange(cursor + (el.value.length - oldLen), cursor + (el.value.length - oldLen));
    
    if (typeof updateMkpiDiffUI === 'function') updateMkpiDiffUI();
};

// Xử lý cho ô NGÂN SÁCH TỪNG CÔNG TY
window.handleMkpiCompInput = function(cIdx) {
    const el = document.getElementById(`mkpi_comp_${cIdx}`);
    if (!el) return;
    
    let cursor = el.selectionStart;
    let oldLen = el.value.length;
    
    let clean = String(el.value).replace(/[^0-9]/g, '');
    window._masterKpiState.companies[cIdx].target = Number(clean) || 0;
    
    // Ép cứng định dạng dấu CHẤM (.)
    el.value = clean.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    
    el.setSelectionRange(cursor + (el.value.length - oldLen), cursor + (el.value.length - oldLen));
    
    if (typeof updateMkpiDiffUI === 'function') updateMkpiDiffUI();
};
window.updateMkpiDiffUI = function() {
  const sumComps = window._masterKpiState.companies.reduce((sum, c) => sum + c.target, 0);
  const diff = window._masterKpiState.totalTarget - sumComps;
  const alertEl = document.getElementById('mkpi_diff_alert');
  
  if(alertEl) {
     if (diff === 0 && window._masterKpiState.totalTarget > 0 && window._masterKpiState.companies.length > 0) {
         alertEl.style.background = 'rgba(16,185,129,0.1)';
         alertEl.style.color = 'var(--emerald)';
         alertEl.style.border = '1px solid var(--emerald)';
         alertEl.innerHTML = `Tổng các công ty: ${(sumComps/1000).toLocaleString('en-US')}k<br>✅ ĐÃ KHỚP 100% SỐ TỔNG!`;
     } else {
         alertEl.style.background = 'rgba(245,158,11,0.1)';
         alertEl.style.color = 'var(--amber)';
         alertEl.style.border = '1px dashed var(--amber)';
         alertEl.innerHTML = `Tổng các công ty: ${(sumComps/1000).toLocaleString('en-US')}k<br>⚠️ Đang lệch: ${(diff/1000).toLocaleString('en-US')}k`;
     }
  }
};

// ================= SMART SEARCH SKU =================
window.searchMkpiSku = function(cIdx, keyword) {
  const q = typeof removeAccents === 'function' ? removeAccents(keyword.trim().toLowerCase()) : keyword.trim().toLowerCase();
  const resEl = document.getElementById(`mkpi_res_${cIdx}`);
  if (!resEl) return;
  if (!q) { resEl.classList.add('hidden'); return; }
  
  const compCode = window._masterKpiState.companies[cIdx].compCode;
 const matched = (typeof products !== 'undefined' ? products : []).filter(p => {
      // THÊM CHỐT CHẶN: Ẩn ngay nếu Cty hoặc ĐVT bị đóng
      if (!isProductAllowedByCompanyDvt(p)) return false;

      let pCodeStr = String(p.code || '').toUpperCase();
      let extractedCtu = 'KHAC';
      if (pCodeStr.startsWith('11') || pCodeStr.includes('TLSG')) extractedCtu = '11';
      else {
          let m = pCodeStr.match(/^\[(.*?)\]/);
          if (m) extractedCtu = m[1].trim();
          else {
              let pts = pCodeStr.split(/[-_]/);
              if (pts.length > 1) extractedCtu = pts[0].trim();
              else if (pCodeStr.length >= 2) extractedCtu = pCodeStr.substring(0, 2);
          }
      }
      if (extractedCtu !== compCode) return false;
      const txt = typeof removeAccents === 'function' ? removeAccents(`${p.code} ${p.name}`).toLowerCase() : `${p.code} ${p.name}`.toLowerCase();
      return txt.includes(q);
  }).slice(0, 20);

  if (matched.length > 0) {
      resEl.innerHTML = matched.map(p => `
          <div onclick="addMkpiSku(${cIdx}, '${p.code}', '${(p.name||'').replace(/'/g, "\\'")}')" 
               style="padding:12px 14px; border-bottom:1px solid var(--card-border); cursor:pointer; font-size:13px; font-weight:800; transition:0.2s;"
               onmouseover="this.style.background='rgba(37,99,235,0.05)'" onmouseout="this.style.background='transparent'">
              <span style="color:var(--primary);">[${p.code}]</span> ${p.name}
          </div>
      `).join('');
      resEl.classList.remove('hidden');
  } else {
      resEl.innerHTML = '<div style="padding:14px; color:var(--text-muted); font-size:13px; font-style:italic; text-align:center;">Không tìm thấy vật tư.</div>';
      resEl.classList.remove('hidden');
  }
};

// Thay thế hàm addMkpiSku cũ để HẾT LAG
window.addMkpiSku = function(cIdx, skuCode, skuName) {
  if(!window._masterKpiState.companies[cIdx].focusSkus.find(s => s.skuCode === skuCode)) {
      window._masterKpiState.companies[cIdx].focusSkus.push({ skuCode, skuName, qty: 0 });
  }
  
  // Gọi hàm vẽ cục bộ thay vì renderMasterKpiStep1()
  renderMkpiSkuList(cIdx); 

  // Tự động xóa ô tìm kiếm và giữ con trỏ để gõ tiếp
  setTimeout(() => {
      const searchInput = document.getElementById(`mkpi_search_${cIdx}`);
      const resEl = document.getElementById(`mkpi_res_${cIdx}`);
      if (searchInput) {
          searchInput.value = '';
          searchInput.focus();
      }
      if (resEl) resEl.classList.add('hidden');
  }, 0);
};

// Thay thế hàm handleMkpiSkuInput cũ để FORMAT CÓ DẤU CHẤM
window.handleMkpiSkuInput = function(cIdx, sIdx, el) {
  // el chính là ô input được truyền vào từ từ khóa 'this'
  const cleanVal = el.value.replace(/[^0-9]/g, '');
  const numVal = Number(cleanVal) || 0;
  
  window._masterKpiState.companies[cIdx].focusSkus[sIdx].qty = numVal;
  
  // Format lại có dấu chấm và hiển thị ra UI
  const formatted = numVal > 0 ? numVal.toLocaleString('en-US') : '';
  if (el.value.replace(/,/g, '') !== cleanVal) {
      el.value = formatted;
  }
};
window.renderMkpiSkuList = function(cIdx) {
    const container = document.getElementById(`mkpi_sku_list_${cIdx}`);
    const countBadge = document.getElementById(`mkpi_sku_count_${cIdx}`);
    if (!container) return;

    const c = window._masterKpiState.companies[cIdx];
    if (countBadge) countBadge.innerText = `${c.focusSkus.length} mã đã chọn`;

    if (c.focusSkus.length === 0) {
        container.innerHTML = `
            <div style="text-align:center; padding:20px; background:var(--card-bg); border-radius:10px; border:1px dashed var(--card-border); color:var(--text-muted);">
                <i class="fa-solid fa-magnifying-glass-plus" style="margin-bottom:8px; font-size:24px; opacity:0.5;"></i><br>
                <span style="font-size:13px; font-weight:700;">Chưa có sản phẩm nào. Tìm và thêm ở ô bên dưới.</span>
            </div>
        `;
        return;

// ================= CHUYỂN BƯỚC 2 VÀ SỬA LỖI TOÁN HỌC (AUTO-SPLIT REMAINDER FIX) =================
window.validateAndGoToStep2 = function() {
  const sumComps = window._masterKpiState.companies.reduce((sum, c) => sum + c.target, 0);
  if (window._masterKpiState.totalTarget === 0) return alert("Vui lòng nhập Tổng doanh số cần giao!");
  if (window._masterKpiState.companies.length === 0) return alert("Chưa chọn công ty nào để phân bổ!");
  if (sumComps !== window._masterKpiState.totalTarget) {
     return alert("Số tổng của các Công ty KHÔNG KHỚP với Tổng Chỉ Tiêu Tháng! Hãy cân đối lại cho khớp 100%.");
  }
  
  // KIỂM TRA: Phải chọn ít nhất 1 nhân viên
  if (!window._masterKpiState.selectedSalesCodes || window._masterKpiState.selectedSalesCodes.length === 0) {
      return alert("Vui lòng chọn ít nhất 1 nhân viên để rải số!");
  }

  // Lọc lấy đúng những nhân viên đã được tích chọn trên giao diện
  const allSales = typeof users !== 'undefined' ? users.filter(u => u.role === 'sales' && u.active !== false) : [];
  const salesUsers = allSales.filter(u => window._masterKpiState.selectedSalesCodes.includes(u.code));

  if (salesUsers.length === 0) return alert("Không tìm thấy dữ liệu nhân viên hợp lệ!");
  
  const totalSales = salesUsers.length;

  if (!window._masterKpiState.salesAllocations.initialized) {
     salesUsers.forEach(s => {
       window._masterKpiState.salesAllocations[s.code] = { name: s.name, companies: {}, skus: {} };
     });

     window._masterKpiState.companies.forEach(c => {
         let compAssignedTotal = 0;
         let skuAssignedTotal = {};
         c.focusSkus.forEach(sku => skuAssignedTotal[sku.skuCode] = 0);

         salesUsers.forEach((s, idx) => {
             // Người cuối gánh số dôi dư (Fix lỗi phép chia không tròn)
             if (idx === totalSales - 1) {
                 window._masterKpiState.salesAllocations[s.code].companies[c.compCode] = c.target - compAssignedTotal;
                 c.focusSkus.forEach(sku => {
                     window._masterKpiState.salesAllocations[s.code].skus[sku.skuCode] = sku.qty - skuAssignedTotal[sku.skuCode];
                 });
             } else {
                 let compVal = Math.round(c.target / totalSales);
                 window._masterKpiState.salesAllocations[s.code].companies[c.compCode] = compVal;
                 compAssignedTotal += compVal;

                 c.focusSkus.forEach(sku => {
                     let skuVal = Math.round(sku.qty / totalSales);
                     window._masterKpiState.salesAllocations[s.code].skus[sku.skuCode] = skuVal;
                     skuAssignedTotal[sku.skuCode] += skuVal;
                 });
             }
         });
     });
     window._masterKpiState.salesAllocations.initialized = true;
  } else {
     // NẾU LÀ "XEM & SỬA": Tự động vá (Patch) nếu Admin thêm công ty/SKU mới ở Bước 1
     salesUsers.forEach(s => {
         if (!window._masterKpiState.salesAllocations[s.code]) {
             window._masterKpiState.salesAllocations[s.code] = { name: s.name, companies: {}, skus: {} };
         }
         window._masterKpiState.companies.forEach(c => {
             if (window._masterKpiState.salesAllocations[s.code].companies[c.compCode] === undefined) {
                 window._masterKpiState.salesAllocations[s.code].companies[c.compCode] = 0;
             }
             c.focusSkus.forEach(sku => {
                 if (window._masterKpiState.salesAllocations[s.code].skus[sku.skuCode] === undefined) {
                     window._masterKpiState.salesAllocations[s.code].skus[sku.skuCode] = 0;
                 }
             });
         });
     });
  }
  
  // Chuyển sang hiển thị Bước 2 với ĐÚNG danh sách NV đã chọn
  renderMasterKpiStep2(salesUsers);
};

// Cập nhật hàm nhập số liệu: Đã thêm code tính tổng (Real-time Grand Total)
window.handleStep2CompInput = function(salesCode, compCode, el) {
    if (!el) return;
    let cursor = el.selectionStart;
    let oldLen = el.value.length;

    const cleanVal = el.value.replace(/[^0-9]/g, '');
    window._masterKpiState.salesAllocations[salesCode].companies[compCode] = Number(cleanVal) || 0;
    
    const formattedVal = cleanVal.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    if (el.value !== formattedVal) {
        el.value = formattedVal;
        let newLen = el.value.length;
        let newCursorPos = cursor + (newLen - oldLen);
        el.setSelectionRange(newCursorPos, newCursorPos);
    }
    
    // Tính lại Dòng Tổng (Grand Total)
    let compTotal = 0;
    window._masterKpiState.selectedSalesCodes.forEach(code => {
        compTotal += (window._masterKpiState.salesAllocations[code]?.companies[compCode] || 0);
    });
    const totalEl = document.getElementById(`total_comp_${compCode}`);
    if(totalEl) totalEl.innerText = compTotal > 0 ? compTotal.toLocaleString('en-US') : '0';

    updateStep2DiffUI();
};

window.handleStep2SkuInput = function(salesCode, skuCode, el) {
    if (!el) return;
    let cursor = el.selectionStart;
    let oldLen = el.value.length;

    const cleanVal = el.value.replace(/[^0-9]/g, '');
    window._masterKpiState.salesAllocations[salesCode].skus[skuCode] = Number(cleanVal) || 0;
    
    const formattedVal = cleanVal.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    if (el.value !== formattedVal) {
        el.value = formattedVal;
        let newLen = el.value.length;
        let newCursorPos = cursor + (newLen - oldLen);
        el.setSelectionRange(newCursorPos, newCursorPos);
    }
    
    // Tính lại Dòng Tổng (Grand Total)
    let skuTotal = 0;
    window._masterKpiState.selectedSalesCodes.forEach(code => {
        skuTotal += (window._masterKpiState.salesAllocations[code]?.skus[skuCode] || 0);
    });
    const totalEl = document.getElementById(`total_sku_${skuCode}`);
    if(totalEl) totalEl.innerText = skuTotal > 0 ? skuTotal.toLocaleString('en-US') : '0';

    updateStep2DiffUI();
};
  window.filterStep2Skus = function(salesCode, compCode, keyword) {
    const q = typeof removeAccents === 'function' ? removeAccents(keyword.trim().toLowerCase()) : keyword.trim().toLowerCase();
    const container = document.getElementById(`s2_sku_list_${salesCode}_${compCode}`);
    if (!container) return;

    // Lấy tất cả các dòng SKU trong hộp cuộn đó
    const items = container.querySelectorAll('.s2-sku-item');
    
    items.forEach(item => {
        const code = item.getAttribute('data-sku-code') || '';
        const name = item.getAttribute('data-sku-name') || '';
        const txt = typeof removeAccents === 'function' ? removeAccents(`${code} ${name}`) : `${code} ${name}`;
        
        // Khớp từ khóa thì hiện, không thì ẩn
        if (txt.includes(q)) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
};
window.updateStep2DiffUI = function() {
  const salesUsers = typeof users !== 'undefined' ? users.filter(u => u.role === 'sales' && u.active !== false && window._masterKpiState.selectedSalesCodes.includes(u.code)) : [];
  let isAllValid = true;

  window._masterKpiState.companies.forEach(c => {
     // Tính toán lệch Doanh số (Tiền)
     let sumSalesComp = salesUsers.reduce((sum, s) => sum + (window._masterKpiState.salesAllocations[s.code].companies[c.compCode] || 0), 0);
     let diffComp = c.target - sumSalesComp;
     
     // Tính toán lệch Sản lượng (Thùng) của tất cả SKU thuộc công ty này
     let skuErrors = [];
     c.focusSkus.forEach(sku => {
        let sumSalesSku = salesUsers.reduce((sum, s) => sum + (window._masterKpiState.salesAllocations[s.code].skus[sku.skuCode] || 0), 0);
        let diffSku = sku.qty - sumSalesSku;
        if (diffSku !== 0) {
            skuErrors.push(`[${sku.skuCode}] Lệch ${diffSku} Th`);
            isAllValid = false;
        }
     });

     // Render nhãn cảnh báo lên Header của Công ty
     const headerLabel = document.getElementById(`s2_diff_comp_header_${c.compCode}`);
     if (headerLabel) {
         if (diffComp === 0 && skuErrors.length === 0) {
             headerLabel.innerHTML = '<i class="fa-solid fa-check"></i> Khớp 100%';
             headerLabel.style.background = 'rgba(16,185,129,0.1)'; 
             headerLabel.style.color = 'var(--emerald)';
             headerLabel.style.border = '1px solid var(--emerald)';
         } else {
             isAllValid = false;
             let errText = [];
             if (diffComp !== 0) errText.push(`Tiền lệch: ${(diffComp/1000).toLocaleString('en-US')}k`);
             if (skuErrors.length > 0) errText.push(skuErrors.join(' | '));
             
             headerLabel.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${errText.join(' - ')}`;
             headerLabel.style.background = 'rgba(225,29,72,0.1)'; 
             headerLabel.style.color = 'var(--rose)';
             headerLabel.style.border = '1px dashed var(--rose)';
         }
     }
  });

  // Kích hoạt hoặc vô hiệu hóa nút Lưu
  const saveBtn = document.getElementById('btn_save_master_kpi');
  if (saveBtn) {
      if (isAllValid) {
          saveBtn.style.opacity = '1';
          saveBtn.style.pointerEvents = 'auto';
          saveBtn.style.background = 'var(--emerald)';
          saveBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> XÁC NHẬN CHỐT & GIAO CHỈ TIÊU';
      } else {
          saveBtn.style.opacity = '0.5';
          saveBtn.style.pointerEvents = 'none';
          saveBtn.style.background = 'var(--rose)';
          saveBtn.innerHTML = '<i class="fa-solid fa-ban"></i> SỐ LIỆU ĐANG LỆCH, KHÔNG THỂ LƯU';
      }
  }
};

window.validateAndSaveMasterKpiToDatabase = async function() {
  const salesUsers = typeof users !== 'undefined' ? users.filter(u => u.role === 'sales' && u.active !== false) : [];
  
  const btn = document.getElementById('btn_save_master_kpi');
  if(btn) {
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG ĐỒNG BỘ XUỐNG THIẾT BỊ SALES...';
    btn.disabled = true;
  }

  try {
     const batch = typeof writeBatch !== 'undefined' ? writeBatch(db) : null;
     if (!batch) throw new Error("Database không khả dụng.");
     
     salesUsers.forEach(s => {
        const sCode = s.code;
        const safeCode = sCode.replace(/[\/\\]/g, '_');
        const targetDocId = `tgt_${safeCode}_${window._chiTieuTargetMonth}`; 
        const docRef = doc(db, "monthlyTargets", targetDocId);
        let companyRevenues = {};
        let items = [];

        window._masterKpiState.companies.forEach(c => {
           let targetRev = window._masterKpiState.salesAllocations[sCode].companies[c.compCode] || 0;
           if (targetRev > 0) {
              companyRevenues[c.compCode] = { target: targetRev, compName: c.compName };
           }

           c.focusSkus.forEach(sku => {
              let qtyTarget = window._masterKpiState.salesAllocations[sCode].skus[sku.skuCode] || 0;
              if (qtyTarget > 0) {
                 items.push({
                    skuCode: sku.skuCode,
                    skuName: sku.skuName,
                    compCode: c.compCode,
                    compName: c.compName,
                    target: qtyTarget,
                    createdByUid: currentUser.uid,
                    createdByRole: currentUser.role
                 });
              }
           });
        });

        batch.set(docRef, {
           salesCode: sCode,
           maDonVi: window.currentWorkingTenant,
           month: window._chiTieuTargetMonth,
           items: items,
           companyRevenues: companyRevenues,
           lastUpdatedByCode: currentUser.code,
           lastUpdatedByName: currentUser.name,
           lastUpdatedAt: new Date().toISOString()
        });
     });

     await batch.commit();

     if (typeof playSystemSound === 'function') playSystemSound('success');
     alert(`✅ ĐÃ LƯU VÀ GIAO CHỈ TIÊU THÀNH CÔNG XUỐNG THIẾT BỊ CỦA ${salesUsers.length} NHÂN VIÊN!`);
     closeTargetModal();
     if (typeof calculateAndRenderTargets === 'function') calculateAndRenderTargets(); 

  } catch (err) {
     alert("Lỗi khi đồng bộ lên hệ thống: " + err.message);
     if(btn) {
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> THỬ LẠI';
        btn.disabled = false;
     }
  }
};

window.executeTransferKpi = async function(fromUid, fromSalesCode) {
    const toSalesCode = document.getElementById('transferToSalesCode').value;
    if (!toSalesCode) return alert("Vui lòng chọn người tiếp nhận!");

    // Tìm thông tin người nhận
    const toUser = users.find(u => u.code === toSalesCode);
    if (!toUser) return alert("Lỗi không tìm thấy dữ liệu người nhận!");

    // Tìm thông tin người giao
    const fromUser = users.find(u => u.uid === fromUid);
    const fromName = fromUser ? fromUser.name : '';

    // Cập nhật thông báo hiển thị đầy đủ cả Mã + Tên
    const confirmTransfer = await window.showCustomConfirm(
        "Xác Nhận Bàn Giao", 
        `Bạn có chắc chắn muốn chuyển toàn bộ Chỉ tiêu và Tuyến của [${fromSalesCode}] ${fromName} sang cho [${toSalesCode}] ${toUser.name} không?\nLưu ý: Chỉ tiêu sẽ được cộng dồn, phần thực đạt cũ vẫn giữ nguyên ở tên người cũ để tính lương.`, 
        "fa-triangle-exclamation", 
        "Đồng ý Chuyển", 
        "Hủy"
    );
    if (!confirmTransfer) return;

    try {
        const batch = writeBatch(db);
        const targetMonth = window._chiTieuTargetMonth;
        
        // 1. Chuyển giao Tuyến (Cộng dồn mảng Route)
        if (fromUser && fromUser.assignedRoutes && fromUser.assignedRoutes.length > 0) {
            let toAssignedRoutes = toUser.assignedRoutes || [];
            // Merge mảng tuyến và lọc trùng
            let mergedRoutes = Array.from(new Set([...toAssignedRoutes, ...fromUser.assignedRoutes]));
            batch.update(doc(db, "users", toUser.uid), { assignedRoutes: mergedRoutes });
            batch.update(doc(db, "users", fromUid), { assignedRoutes: [] }); // Gỡ tuyến người cũ
        }

        // 2. Chuyển giao Chỉ Tiêu (Cộng dồn target)
        // 2. Chuyển giao Chỉ Tiêu (Cộng dồn target)
        const safeFromCode = fromSalesCode.replace(/[\/\\]/g, '_');
        const safeToCode = toSalesCode.replace(/[\/\\]/g, '_');
        const fromTargetRef = doc(db, "monthlyTargets", `tgt_${safeFromCode}_${targetMonth}`);
        const toTargetRef = doc(db, "monthlyTargets", `tgt_${safeToCode}_${targetMonth}`);
        const fromSnap = await getDoc(fromTargetRef);
        const toSnap = await getDoc(toTargetRef);

        if (fromSnap.exists()) {
            let fromData = fromSnap.data();
            let toData = toSnap.exists() ? toSnap.data() : { salesCode: toSalesCode, month: targetMonth, items: [], companyRevenues: {} };
            
            // a. Cộng dồn items (Sản lượng)
            (fromData.items || []).forEach(fItem => {
                let match = toData.items.find(t => t.skuCode === fItem.skuCode);
                if (match) {
                    match.target += Number(fItem.target || 0); // Cộng dồn
                } else {
                    toData.items.push({...fItem}); // Thêm mới
                }
            });

            // b. Cộng dồn companyRevenues (Doanh số công ty)
            let fRevs = fromData.companyRevenues || {};
            let tRevs = toData.companyRevenues || {};
            Object.keys(fRevs).forEach(cCode => {
                if (tRevs[cCode]) {
                    tRevs[cCode].target += Number(fRevs[cCode].target || 0);
                } else {
                    tRevs[cCode] = {...fRevs[cCode]};
                }
            });
            toData.companyRevenues = tRevs;
            
            // Cập nhật lên Database
            batch.set(toTargetRef, toData, { merge: true });
            // Cập nhật người cũ thành 0 để không bị ảo số tổng công ty
            batch.update(fromTargetRef, { items: [], companyRevenues: {} });
        }

        await batch.commit();

        // 3. Ẩn Modal và Cập nhật giao diện
        document.getElementById('dynamicModalContainer').classList.add('hidden');
        if (typeof playSystemSound === 'function') playSystemSound('success');
        alert(`✅ Đã chuyển giao thành công toàn bộ Tuyến và Chỉ tiêu sang cho ${toUser.name}! Bạn có thể vào tab Nhân viên để Khóa tài khoản của người nghỉ.`);
        
        // Chọn lại tên người nhận để xem kết quả
        window._chiTieuTargetSalesCode = toSalesCode;
        calculateAndRenderTargets();

    } catch (e) {
        alert("Lỗi khi chuyển giao: " + e.message);
    }
};

window.toggleRouteSelection = async function(routeCode) {
    if (!window._tempAssignedRoutes) return;
    
    const idx = window._tempAssignedRoutes.indexOf(String(routeCode));
    if (idx > -1) {
        window._tempAssignedRoutes.splice(idx, 1); // Bỏ chọn
    } else {
        window._tempAssignedRoutes.push(String(routeCode)); // Chọn
    }
    
    const activePane = document.getElementById('tabPane_chiTieu');
    if (activePane) {
        // 1. CHỤP LẠI TỌA ĐỘ HIỆN TẠI TRƯỚC KHI VẼ LẠI
        const mainScrollY = window.pageYOffset || document.documentElement.scrollTop;
        const scrollBox = document.getElementById('routeGridScrollBox');
        const gridScrollTop = scrollBox ? scrollBox.scrollTop : 0;

        // 2. KHÓA CỨNG CHIỀU CAO GIAO DIỆN ĐỂ TRÁNH BỊ SẬP LAYOUT
        const currentHeight = activePane.getBoundingClientRect().height;
        activePane.style.minHeight = currentHeight + 'px';

        // 3. VẼ LẠI GIAO DIỆN (ĐỒNG BỘ)
        await renderChiTieuTab(activePane);

        // 4. TRẢ LẠI TỌA ĐỘ CUỘN NGAY LẬP TỨC (0 ĐỘ TRỄ)
        window.scrollTo({ top: mainScrollY, behavior: 'instant' });
        const newScrollBox = document.getElementById('routeGridScrollBox');
        if (newScrollBox) {
            newScrollBox.scrollTop = gridScrollTop;
        }

        // 5. GỠ KHÓA CHIỀU CAO
        activePane.style.minHeight = '';
    }
    
    if (typeof triggerHaptic === 'function') triggerHaptic(10);
};
window.saveRouteAssignment = async function(uid) {
    if (currentUser.role !== 'admin' && currentUser.role !== 'manager') return;
    
    const selectedRoutes = window._tempAssignedRoutes || [];
    
    try {
        await updateDoc(doc(db, "users", uid), { assignedRoutes: selectedRoutes });
        
        // Cập nhật mảng local
        const userIndex = users.findIndex(u => u.uid === uid);
        if (userIndex > -1) users[userIndex].assignedRoutes = [...selectedRoutes];
        if (currentUser.uid === uid) currentUser.assignedRoutes = [...selectedRoutes];
        
        if (typeof playSystemSound === 'function') playSystemSound('success');
        alert("✅ Đã lưu cấu hình Phân Tuyến thành công lên máy chủ!");
    } catch (e) { 
        alert("Lỗi phân tuyến: " + e.message); 
    }
};

window.clearAllRouteAssignments = async function(uid) {
    if (currentUser.role !== 'admin' && currentUser.role !== 'manager') return;
    
    const confirmClear = await window.showCustomConfirm(
        "Thu Hồi Toàn Bộ Tuyến",
        "Bạn có chắc chắn muốn XÓA TRẮNG toàn bộ tuyến của nhân viên này không?\nHành động này sẽ cập nhật ngay lập tức lên hệ thống.",
        "fa-eraser",
        "Đồng ý thu hồi",
        "Hủy"
    );
    if (!confirmClear) return;

    try {
        await updateDoc(doc(db, "users", uid), { assignedRoutes: [] });
        
        const userIndex = users.findIndex(u => u.uid === uid);
        if (userIndex > -1) users[userIndex].assignedRoutes = [];
        if (currentUser.uid === uid) currentUser.assignedRoutes = [];
        
        window._tempAssignedRoutes = []; // Xóa trắng bộ nhớ tạm

  window.adminChangeUserTenant = async function(uid, currentTenant, userName) {
    if (!currentUser || currentUser.role !== 'admin') return;
    
    // Tạo danh sách gợi ý cho Admin dễ nhập
    const tenantOptions = window.SYSTEM_TENANTS.map(t => `${t.id}: ${t.name}`).join('\n');
    
    const newTenant = prompt(`ĐỔI ĐƠN VỊ CHO: [${userName}]\nĐơn vị hiện tại: ${currentTenant}\n\nNhập MÃ ĐƠN VỊ mới (A1, A2, A3 hoặc ALL):\n${tenantOptions}`, currentTenant);
    
    if (!newTenant) return; // Hủy bỏ nếu không nhập gì
    
    const validTenants = window.SYSTEM_TENANTS.map(t => t.id);
    validTenants.push('ALL');
    
    const cleanTenant = newTenant.trim().toUpperCase();
    if (!validTenants.includes(cleanTenant)) {
        return alert("⛔ Mã đơn vị không hợp lệ! Vui lòng nhập đúng mã A1, A2, A3 hoặc ALL.");
    }

    try {
        // Cập nhật lên Firebase
        await updateDoc(doc(db, "users", uid), { maDonVi: cleanTenant });
        
        // Cập nhật lại giao diện ngay lập tức
        const uIndex = users.findIndex(u => u.uid === uid);
        if (uIndex > -1) users[uIndex].maDonVi = cleanTenant;
        
        alert(`✅ Đã chuyển [${userName}] sang đơn vị ${cleanTenant} thành công!`);
        
        // Vẽ lại tab Nhân sự
        const activePane = document.getElementById('tabPane_users');
        if (activePane) renderTabContent('users', activePane);
    } catch(e) {
        alert("Lỗi cập nhật đơn vị: " + e.message);
    }

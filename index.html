<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Sales Thị Trường (DMS)</title>
    <!-- Tailwind CSS (Giao diện) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS (Bản đồ) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- HTML5-QRCode (Quét mã) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-100 font-sans pb-20">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-lg">Sales Field App</h1>
        <span id="status-badge" class="text-xs bg-green-500 px-2 py-1 rounded-full">Online</span>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-4">
        
        <!-- Tab Navigation -->
        <div class="flex border-b border-gray-300 bg-white rounded-t shadow-sm">
            <button onclick="switchTab('checkin')" class="flex-1 py-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600" id="tab-btn-checkin">Check-in</button>
            <button onclick="switchTab('order')" class="flex-1 py-2 text-center font-semibold text-gray-500" id="tab-btn-order">Lên Đơn</button>
            <button onclick="switchTab('map')" class="flex-1 py-2 text-center font-semibold text-gray-500" id="tab-btn-map">Bản Đồ</button>
        </div>

        <!-- TAB 1: CHECK-IN & CHỤP ẢNH -->
        <section id="tab-checkin" class="bg-white p-4 rounded-b shadow space-y-4">
            <h2 class="font-bold text-gray-700">1. Check-in Điểm Bán</h2>
            
            <button onclick="startScanner()" class="w-full bg-purple-600 text-white py-2 rounded font-medium hover:bg-purple-700">
                📷 Quét mã QR Quầy
            </button>
            <div id="reader" class="hidden w-full rounded overflow-hidden"></div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Tên Tạp Hóa / Quầy:</label>
                <input type="text" id="store-name" placeholder="Ví dụ: Tạp hóa Tấn Phát" class="w-full border p-2 rounded mt-1">
            </div>

            <button onclick="getGPS()" class="w-full bg-blue-500 text-white py-2 rounded font-medium hover:bg-blue-600">
                📍 Lấy Vị Trí GPS
            </button>
            <p id="gps-info" class="text-xs text-gray-500 italic">Tọa độ: Chưa xác định</p>

            <div>
                <label class="block text-sm font-medium text-gray-700">Chụp ảnh trưng bày (Photo Proof):</label>
                <input type="file" id="camera-input" accept="image/*" capture="camera" onchange="previewImage(event)" class="mt-1 block w-full text-sm text-gray-500">
                <img id="photo-preview" class="hidden mt-2 w-full h-40 object-cover rounded border">
            </div>

            <button onclick="saveCheckin()" class="w-full bg-green-600 text-white py-3 rounded font-bold hover:bg-green-700">
                LƯU CHECK-IN
            </button>
        </section>

        <!-- TAB 2: LÊN ĐƠN HÀNG & KHUYẾN MÃI -->
        <section id="tab-order" class="hidden bg-white p-4 rounded-b shadow space-y-4">
            <h2 class="font-bold text-gray-700">2. Tạo Đơn Hàng</h2>
            
            <div class="space-y-2">
                <div class="flex justify-between items-center border-b pb-2">
                    <div>
                        <p class="font-semibold">Nước Ngọt Coca (Thùng)</p>
                        <p class="text-xs text-gray-500">200,000đ</p>
                    </div>
                    <input type="number" id="qty-coca" value="0" min="0" onchange="calculateTotal()" class="w-16 border text-center p-1 rounded">
                </div>
                <div class="flex justify-between items-center border-b pb-2">
                    <div>
                        <p class="font-semibold">Bánh Snack (Thùng)</p>
                        <p class="text-xs text-gray-500">150,000đ</p>
                    </div>
                    <input type="number" id="qty-snack" value="0" min="0" onchange="calculateTotal()" class="w-16 border text-center p-1 rounded">
                </div>
            </div>

            <!-- Promotion Box -->
            <div id="promo-box" class="bg-yellow-50 border-l-4 border-yellow-400 p-2 text-xs text-yellow-700 hidden">
                🎉 <b>Ưu đãi:</b> Giảm 5% cho đơn hàng trên 1.000.000đ!
            </div>

            <div class="border-t pt-2 space-y-1">
                <p class="flex justify-between text-sm"><span>Tổng tiền:</span> <span id="subtotal-val">0 đ</span></p>
                <p class="flex justify-between text-sm text-green-600"><span>Chiết khấu:</span> <span id="discount-val">-0 đ</span></p>
                <p class="flex justify-between font-bold text-base text-red-600"><span>Thanh toán:</span> <span id="total-val">0 đ</span></p>
            </div>

            <button onclick="printInvoice()" class="w-full bg-orange-500 text-white py-2 rounded font-bold hover:bg-orange-600">
                🖨️ In Hóa Đơn Xem Trước
            </button>
        </section>

        <!-- TAB 3: BẢN ĐỒ LỘ TRÌNH -->
        <section id="tab-map" class="hidden bg-white p-4 rounded-b shadow space-y-2">
            <h2 class="font-bold text-gray-700">3. Bản Đồ Tuyến Đường</h2>
            <div id="map" class="w-full h-80 rounded border"></div>
        </section>

    </main>

    <!-- JS Handling Logic -->
    <script>
        let currentCoords = null;
        let photoBase64 = null;
        let map = null;

        // 1. Switch Tabs
        function switchTab(tabName) {
            ['checkin', 'order', 'map'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-btn-${t}`).className = "flex-1 py-2 text-center font-semibold text-gray-500";
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tabName}`).className = "flex-1 py-2 text-center font-semibold text-blue-600 border-b-2 border-blue-600";

            if(tabName === 'map' && !map) initMap();
        }

        // 2. GPS Location
        function getGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    currentCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    document.getElementById('gps-info').innerText = `Tọa độ: ${currentCoords.lat.toFixed(5)}, ${currentCoords.lng.toFixed(5)}`;
                }, () => alert("Không thể lấy vị trí. Hãy bật GPS!"));
            }
        }

        // 3. Photo Proof Preview
        function previewImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    photoBase64 = evt.target.result;
                    const img = document.getElementById('photo-preview');
                    img.src = photoBase64;
                    img.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        // 4. QR Scanner
        function startScanner() {
            document.getElementById('reader').classList.remove('hidden');
            const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((decodedText) => {
                document.getElementById('store-name').value = decodedText;
                html5QrcodeScanner.clear();
                document.getElementById('reader').classList.add('hidden');
            });
        }

        // 5. Calculate Order & Promo
        function calculateTotal() {
            const coca = parseInt(document.getElementById('qty-coca').value) || 0;
            const snack = parseInt(document.getElementById('qty-snack').value) || 0;
            let subtotal = (coca * 200000) + (snack * 150000);
            let discount = 0;

            if (subtotal >= 1000000) {
                discount = subtotal * 0.05;
                document.getElementById('promo-box').classList.remove('hidden');
            } else {
                document.getElementById('promo-box').classList.add('hidden');
            }

            let total = subtotal - discount;
            document.getElementById('subtotal-val').innerText = subtotal.toLocaleString() + ' đ';
            document.getElementById('discount-val').innerText = '-' + discount.toLocaleString() + ' đ';
            document.getElementById('total-val').innerText = total.toLocaleString() + ' đ';
        }

        // 6. Save Data (Offline Ready)
        function saveCheckin() {
            const store = document.getElementById('store-name').value;
            if(!store) return alert("Vui lòng nhập tên quầy!");

            const checkinData = {
                store: store,
                coords: currentCoords,
                photo: photoBase64,
                time: new Date().toLocaleString()
            };

            let history = JSON.parse(localStorage.getItem('sales_history') || '[]');
            history.push(checkinData);
            localStorage.setItem('sales_history', JSON.stringify(history));

            alert("✅ Đã lưu Check-in thành công vào thiết bị!");
        }

        // 7. Initialize Map (Leaflet)
        function initMap() {
            map = L.map('map').setView([10.7769, 106.7009], 13); // Mặc định TP.HCM
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Đánh dấu vị trí giả định quầy
            L.marker([10.7769, 106.7009]).addTo(map).bindPopup('Tạp hóa Tấn Phát').openPopup();
            L.marker([10.7800, 106.6950]).addTo(map).bindPopup('Cửa hàng An Bình');
        }

        // 8. Print Invoice Preview
        function printInvoice() {
            window.print();
        }
    </script>
</body>
</html>

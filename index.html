<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống DMS/SFA - Giám Sát Kỷ Luật & Quản Lý Sales</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- HTML5 QR Code Scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
  :root { --navy:#12213D; --amber:#FCA311; --paper:#F6F1E6; --line:#D9D0BC; --muted:#6B6558; --green:#2D6A4F; --red:#C1121F; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--navy);color:#1a1a1a;padding:12px;}
  .app{max-width:1300px;margin:0 auto;}
  .panel{background:var(--paper);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3);margin-top:12px;}
  h1,h2,h3,h4{font-family:'Oswald',sans-serif;color:var(--navy);}
  
  .topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;flex-wrap:wrap;gap:12px;}
  .nav-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .btn{background:var(--navy);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;}
  .btn-amber{background:var(--amber);color:var(--navy);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-sm{padding:4px 8px;font-size:11px;}
  
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:12px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
  .badge{display:inline-block;padding:3px 8px;background:#EFE7D6;border-radius:4px;font-size:11px;font-weight:700;}
  .badge-success{background:#D8F3DC;color:var(--green);}
  .badge-pending{background:#FFF3BF;color:#B57700;}
  .badge-danger{background:#F8D7DA;color:var(--red);}
  .badge-cat{background:#E0AFA0;color:#4A154B;font-size:10px;margin-left:4px;}
  
  input, select, textarea { width:100%; padding:8px; margin:4px 0 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; font-size:13px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); font-size:12px; }
  th { background:#EFE7D6; color:var(--navy); }
  
  .login-box{max-width:380px;margin:50px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.4);}
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;z-index:999;}
  .modal-content{background:#fff;padding:24px;border-radius:16px;width:90%;max-width:400px;}
  .hidden{display:none !important;}
  .stat-number{font-size:24px;font-weight:700;color:var(--navy);margin-top:4px;}
  .cart-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);}
  #map { height: 350px; width: 100%; border-radius: 12px; margin-top: 10px; z-index: 1; }
  .cat-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;}
  .cat-chip{padding:4px 10px;background:#EFE7D6;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .cat-chip.active{background:var(--navy);color:#fff;}
  .watermark-img{max-width:100%;border-radius:8px;margin-top:6px;border:2px solid var(--navy);}
  .alert-box{background:#F8D7DA;color:var(--red);padding:10px;border-radius:8px;font-size:12px;margin-bottom:10px;font-weight:600;}
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc, runTransaction, serverTimestamp, enableIndexedDbPersistence } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC7JD5MhzMka84JPyVG_5LbZjPz8JOnbuc",
    authDomain: "uy-phan.firebaseapp.com",
    projectId: "uy-phan",
    storageBucket: "uy-phan.firebasestorage.app",
    messagingSenderId: "387969382999",
    appId: "1:387969382999:web:772ccbb251eb4871b28112"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  enableIndexedDbPersistence(db).catch(() => {});

  let currentUser = null;
  let currentTab = 'sales'; 
  let stores = [], orders = [], users = [], checkins = [], products = [], promos = [], posmAudits = [];
  let currentCart = [];
  let activeVisitedStore = null;
  let selectedCategoryFilter = 'Tất cả';
  let html5QrScanner = null;

  // REALTIME LISTENERS
  onSnapshot(collection(db, "stores"), snap => { stores = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
  onSnapshot(collection(db, "orders"), snap => { orders = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
  onSnapshot(collection(db, "users"), snap => { users = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
  onSnapshot(collection(db, "checkins"), snap => { checkins = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
  onSnapshot(collection(db, "products"), snap => { products = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
  onSnapshot(collection(db, "promos"), snap => { promos = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });
  onSnapshot(collection(db, "posmAudits"), snap => { posmAudits = snap.docs.map(d => ({id:d.id, ...d.data()})); renderUI(); });

  // HAVERSINE CALCULATOR (<30M)
  function getDistanceMeters(lat1, lon1, lat2, lon2) {
    if (!lat1 || !lon1 || !lat2 || !lon2) return 0;
    const R = 6371e3;
    const rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad;
    const dLon = (lon2 - lon1) * rad;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  // WATERMARK ENGINE
  function createWatermarkedImage(file, infoText) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 800;
          const scale = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
          ctx.fillRect(0, canvas.height - 70, canvas.width, 70);
          
          ctx.fillStyle = "#FCA311";
          ctx.font = "bold 16px Inter, sans-serif";
          ctx.fillText(`📍 DMS STAMP: ${infoText.storeName}`, 15, canvas.height - 45);
          
          ctx.fillStyle = "#FFFFFF";
          ctx.font = "12px Inter, sans-serif";
          ctx.fillText(`Mã NV: ${infoText.salesCode} | NV: ${infoText.salesName} | GPS: ${infoText.lat.toFixed(5)}, ${infoText.lng.toFixed(5)}`, 15, canvas.height - 25);
          ctx.fillText(`Thời gian: ${new Date().toLocaleString('vi-VN')}`, 15, canvas.height - 8);
          
          resolve(canvas.toDataURL("image/jpeg", 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // 1. LOGIN & ĐỔI MẬT KHẨU
  window.handleLogin = function(e) {
    e.preventDefault();
    const u = document.getElementById('logUser').value.trim();
    const p = document.getElementById('logPass').value.trim();

    if (u === 'admin' && p === 'admin123') {
      currentUser = { id: 'admin_root', name: 'Admin Quản Lý', username: 'admin', code: 'NV-ADMIN', role: 'admin' };
    } else {
      const found = users.find(x => x.username === u && x.password === p);
      if (found) currentUser = found;
      else return alert("Sai tài khoản hoặc mật khẩu!");
    }
    
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    currentTab = (currentUser.role === 'admin') ? 'dashboard' : 'sales';
    renderUI();
  };

  window.handleLogout = function() {
    currentUser = null;
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('appView').classList.add('hidden');
  };

  window.openChangePasswordModal = function() {
    document.getElementById('changePassModal').classList.remove('hidden');
  };

  window.closeChangePasswordModal = function() {
    document.getElementById('changePassModal').classList.add('hidden');
  };

  window.submitChangePassword = async function(e) {
    e.preventDefault();
    const oldP = document.getElementById('oldPassInput').value;
    const newP = document.getElementById('newPassInput').value;
    const confirmP = document.getElementById('confirmPassInput').value;

    if (newP !== confirmP) return alert("Mật khẩu mới không trùng khớp!");
    if (newP.length < 4) return alert("Mật khẩu phải từ 4 ký tự trở lên!");

    if (currentUser.username === 'admin') {
      alert("Tài khoản Root Admin mẫu không hỗ trợ đổi pass tạm thời.");
      closeChangePasswordModal();
      return;
    }

    if (currentUser.password !== oldP) return alert("Mật khẩu cũ không chính xác!");

    await updateDoc(doc(db, "users", currentUser.id), { password: newP });
    currentUser.password = newP;
    alert("✅ Đổi mật khẩu thành công!");
    closeChangePasswordModal();
  };

  // 2. CHECK-IN GPS <30M
  window.doCheckinWithPhoto = function(storeId) {
    const store = stores.find(s => s.id === storeId);
    if (!store) return;

    const fileInput = document.getElementById(`img_${store.id}`);
    if (!fileInput || !fileInput.files[0]) {
      return alert("⛔ BẮT BUỘC CHỤP ẢNH TẠI ĐIỂM BÁN!\nBạn chưa chụp ảnh trực tiếp từ Camera.");
    }

    navigator.geolocation.getCurrentPosition(async pos => {
      const userLat = pos.coords.latitude;
      const userLng = pos.coords.longitude;
      
      if (store.lat && store.lng) {
        const distance = getDistanceMeters(userLat, userLng, store.lat, store.lng);
        if (distance > 30) {
          alert(`⛔ CHECK-IN THẤT BẠI!\n\n- Khoảng cách hiện tại: ${Math.round(distance)}m.\n- Quy định kỷ luật: Bắt buộc dưới 30m!`);
          return;
        }
      }

      const photoData = await createWatermarkedImage(fileInput.files[0], {
        storeName: store.name,
        salesCode: currentUser.code || 'NV001',
        salesName: currentUser.name,
        lat: userLat,
        lng: userLng
      });

      await addDoc(collection(db, "checkins"), {
        salesName: currentUser.name, salesCode: currentUser.code || 'NV001', salesUser: currentUser.username, 
        storeName: store.name, storeId: store.id,
        lat: userLat, lng: userLng, photo: photoData, status: 'Checked-in (Đạt <30m)',
        createdAt: serverTimestamp()
      });

      activeVisitedStore = store;
      alert(`✅ CHECK-IN THÀNH CÔNG!\nĐã xác thực vị trí cách tiệm ${store.name} dưới 30m.`);
      renderUI();
    }, () => {
      alert("⛔ LỖI GPS: Không thể lấy vị trí! Hãy bật GPS trên điện thoại.");
    }, { enableHighAccuracy: true, timeout: 10000 });
  };

  // 3. QUÉT MÃ QR CHECK-IN
  window.startQRScanner = function(storeId) {
    const store = stores.find(s => s.id === storeId);
    document.getElementById('qrModal').classList.remove('hidden');
    
    html5QrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrScanner.render(async (decodedText) => {
      if (decodedText === store.id || decodedText === store.name) {
        html5QrScanner.clear();
        document.getElementById('qrModal').classList.add('hidden');
        alert(`✅ QUÉT MÃ QR THÀNH CÔNG!\nXác nhận đúng mã QR dán tại tiệm: ${store.name}`);
        activeVisitedStore = store;
        renderUI();
      } else {
        alert(`❌ LỖI MÃ QR!\nMã QR này không khớp với cửa hàng ${store.name}.`);
      }
    });
  };

  window.closeQRScanner = function() {
    if (html5QrScanner) html5QrScanner.clear();
    document.getElementById('qrModal').classList.add('hidden');
  };

  // 4. BÁN HÀNG THEO PHÂN LOẠI ĐƠN VỊ TÍNH
  window.addToCartWithUnit = function(productId) {
    const prd = products.find(p => p.id === productId);
    if (!prd || prd.stock <= 0) return alert("Sản phẩm đã HẾT HÀNG!");

    const selectedUnit = document.getElementById(`unit_select_${productId}`).value;
    const unitRate = selectedUnit === 'Thùng' ? (prd.rateBox || 24) : (selectedUnit === 'Lốc' ? (prd.ratePack || 6) : 1);
    const calculatedPrice = prd.price * unitRate;

    const itemKey = `${productId}_${selectedUnit}`;
    const item = currentCart.find(c => c.cartKey === itemKey);

    if (item) {
      if ((item.qty + 1) * unitRate > prd.stock) return alert("Không đủ tồn kho!");
      item.qty += 1;
    } else {
      currentCart.push({ 
        cartKey: itemKey, id: prd.id, code: prd.code, name: prd.name, 
        unit: selectedUnit, unitRate: unitRate, price: calculatedPrice, qty: 1 
      });
    }
    renderCartUI();
  };

  window.removeFromCart = function(cartKey) {
    currentCart = currentCart.filter(c => c.cartKey !== cartKey);
    renderCartUI();
  };

  function renderCartUI() {
    const cartContainer = document.getElementById('cartList');
    if (!cartContainer) return;

    let subtotal = 0;
    let promoGiftList = [];

    currentCart.forEach(item => {
      subtotal += item.price * item.qty;
      promos.forEach(p => {
        if (p.buyPrdId === item.id && (item.qty * item.unitRate) >= p.buyQty) {
          const giftCount = Math.floor((item.qty * item.unitRate) / p.buyQty) * p.getQty;
          promoGiftList.push(`🎁 Tặng ${giftCount} x ${p.getPrdName} (KM Mua ${p.buyQty} Tặng ${p.getQty})`);
        }
      });
    });

    cartContainer.innerHTML = currentCart.map(i => `
      <div class="cart-item">
        <div><b>[${i.code}] ${i.name}</b><br><small>ĐVT: <b style="color:var(--amber);">${i.unit}</b> (${i.price.toLocaleString()}đ) x ${i.qty}</small></div>
        <div><b>${(i.price*i.qty).toLocaleString()}đ</b> <button class="btn btn-red btn-sm" onclick="removeFromCart('${i.cartKey}')">X</button></div>
      </div>
    `).join('') + (promoGiftList.length > 0 ? `<div style="color:var(--green);font-size:11px;margin-top:6px;">${promoGiftList.join('<br>')}</div>` : '');

    document.getElementById('cartTotal').innerText = `${subtotal.toLocaleString('vi-VN')} đ`;
  }

  window.submitOrder = async function(e) {
    e.preventDefault();
    if (currentCart.length === 0) return alert("Vui lòng chọn sản phẩm!");
    
    const storeName = document.getElementById('ordStore').value;
    const storeObj = stores.find(s => s.name === storeName);
    const creditLimit = storeObj?.creditLimit || 20000000;

    const currentDebt = orders.filter(o => o.storeName === storeName && o.paymentStatus !== 'Đã thanh toán')
                              .reduce((sum, o) => sum + (o.amount || 0), 0);

    let subtotal = currentCart.reduce((sum, item) => sum + (item.price * item.qty), 0);

    if ((currentDebt + subtotal) > creditLimit) {
      alert(`⛔ ĐƠN HÀNG BỊ KHÓA DO VƯỢT HẠN MỨC CÔNG NỢ!\n- Dư nợ tiệm: ${currentDebt.toLocaleString()}đ\n- Đơn mới: ${subtotal.toLocaleString()}đ\n- Hạn mức: ${creditLimit.toLocaleString()}đ`);
      return;
    }

    try {
      await runTransaction(db, async (transaction) => {
        for (let item of currentCart) {
          const prdRef = doc(db, "products", item.id);
          const prdDoc = await transaction.get(prdRef);
          const totalBaseQtyNeed = item.qty * item.unitRate;
          if (!prdDoc.exists() || prdDoc.data().stock < totalBaseQtyNeed) throw `Sản phẩm ${item.name} không đủ tồn kho!`;
        }

        for (let item of currentCart) {
          const prdRef = doc(db, "products", item.id);
          const prdDoc = await transaction.get(prdRef);
          const totalBaseQtyNeed = item.qty * item.unitRate;
          transaction.update(prdRef, { stock: prdDoc.data().stock - totalBaseQtyNeed });
        }

        const newOrderRef = doc(collection(db, "orders"));
        transaction.set(newOrderRef, {
          salesName: currentUser.name, salesCode: currentUser.code || 'NV001', salesUser: currentUser.username,
          storeName, items: currentCart, amount: subtotal,
          paymentStatus: 'Công nợ', status: 'Chờ duyệt',
          createdAt: serverTimestamp()
        });
      });

      alert("🚀 Lên đơn hàng thành công!");
      currentCart = [];
      activeVisitedStore = null;
      renderCartUI();
      renderUI();
    } catch (err) { alert("Lỗi tạo đơn: " + err); }
  };

  // MANAGEMENT
  window.addProduct = async function(e) {
    e.preventDefault();
    const code = document.getElementById('prdCode').value.trim();
    const name = document.getElementById('prdName').value.trim();
    const category = document.getElementById('prdCategory').value;
    const baseUnit = document.getElementById('prdBaseUnit').value;
    const ratePack = Number(document.getElementById('prdRatePack').value || 6);
    const rateBox = Number(document.getElementById('prdRateBox').value || 24);
    const price = Number(document.getElementById('prdPrice').value);
    const stock = Number(document.getElementById('prdStock').value);

    await addDoc(collection(db, "products"), { code, name, category, baseUnit, ratePack, rateBox, price, stock, createdAt: serverTimestamp() });
    alert("Đã thêm sản phẩm mới!");
    document.getElementById('prdForm').reset();
  };

  window.deleteProduct = async function(id) { if(confirm("Xóa SP?")) await deleteDoc(doc(db, "products", id)); };
  window.filterCategory = function(cat) { selectedCategoryFilter = cat; renderUI(); };

  window.addUser = async function(e) {
    e.preventDefault();
    const code = document.getElementById('usCode').value.trim();
    const name = document.getElementById('usName').value.trim();
    const username = document.getElementById('usUser').value.trim();
    const password = document.getElementById('usPass').value.trim();
    const role = document.getElementById('usRole').value;

    await addDoc(collection(db, "users"), { code, name, username, password, role, createdAt: serverTimestamp() });
    alert("Tạo tài khoản Nhân viên thành công!");
    document.getElementById('userForm').reset();
  };
  window.deleteUser = async function(id) { if(confirm("Xóa tài khoản?")) await deleteDoc(doc(db, "users", id)); };

  window.addStore = async function(e) {
    e.preventDefault();
    const name = document.getElementById('stName').value;
    const address = document.getElementById('stAddr').value;
    const routeDay = document.getElementById('stRoute').value;
    const creditLimit = Number(document.getElementById('stCredit').value || 20000000);
    const lat = Number(document.getElementById('stLat').value || 0);
    const lng = Number(document.getElementById('stLng').value || 0);

    await addDoc(collection(db, "stores"), { name, address, routeDay, creditLimit, lat, lng, createdAt: serverTimestamp() });
    alert("Đã thêm điểm bán mới!");
    document.getElementById('stForm').reset();
  };

  window.deleteStore = async function(id) { if(confirm("Xóa điểm bán?")) await deleteDoc(doc(db, "stores", id)); };
  window.updateOrderStatus = async function(id, status) { await updateDoc(doc(db, "orders", id), { status }); };
  window.updatePaymentStatus = async function(id, paymentStatus) { await updateDoc(doc(db, "orders", id), { paymentStatus }); };
  window.deleteOrder = async function(id) { if(confirm("Xóa đơn hàng?")) await deleteDoc(doc(db, "orders", id)); };
  window.switchTab = function(tab) { currentTab = tab; renderUI(); };

  function initLiveMap() {
    setTimeout(() => {
      const mapContainer = document.getElementById('map');
      if (!mapContainer) return;
      
      const map = L.map('map').setView([10.7769, 106.7009], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

      let bounds = [];
      checkins.forEach(c => {
        if (c.lat && c.lng) {
          L.marker([c.lat, c.lng]).addTo(map)
            .bindPopup(`<b>[${c.salesCode||'NV'}] ${c.salesName}</b><br>Tiệm: ${c.storeName}`);
          bounds.push([c.lat, c.lng]);
        }
      });
      if (bounds.length > 0) map.fitBounds(bounds);
    }, 300);
  }

  // RENDER MAIN UI
  function renderUI() {
    if (!currentUser) return;
    document.getElementById('userInfo').innerText = `[${currentUser.code || 'ADMIN'}] ${currentUser.name}`;
    
    if (currentUser.role === 'admin') {
      document.getElementById('navAdminUsers').classList.remove('hidden');
      document.getElementById('navAdminDash').classList.remove('hidden');
      document.getElementById('navAdminPrd').classList.remove('hidden');
      document.getElementById('navAdminAudit').classList.remove('hidden');
    } else {
      document.getElementById('navAdminUsers').classList.add('hidden');
      document.getElementById('navAdminDash').classList.add('hidden');
      document.getElementById('navAdminPrd').classList.add('hidden');
      document.getElementById('navAdminAudit').classList.add('hidden');
    }

    const main = document.getElementById('mainContent');

    if (currentTab === 'dashboard') {
      const totalRev = orders.reduce((sum, o) => sum + (o.amount || 0), 0);
      main.innerHTML = `
        <h2>Giám Sát & Báo Cáo Kỷ Luật Realtime</h2>
        <div class="grid">
          <div class="card"><span class="badge">Doanh Số Cloud</span><div class="stat-number">${totalRev.toLocaleString('vi-VN')} đ</div></div>
          <div class="card"><span class="badge">Tổng Đơn Hàng</span><div class="stat-number">${orders.length} đơn</div></div>
          <div class="card"><span class="badge badge-success">Lượt Check-in (<30m)</span><div class="stat-number">${checkins.length} lượt</div></div>
        </div>
        <div class="grid" style="margin-top:16px;">
          <div class="card" style="grid-column: span 3;">
            <h3>🗺️ Bản Đồ Live Tracking Vị Trí Check-in Sales</h3>
            <div id="map"></div>
          </div>
        </div>
      `;
      initLiveMap();
    }
    else if (currentTab === 'sales') {
      const categories = ['Tất cả', 'Hộp', 'Chai', 'Lốc', 'Thùng', 'Khác'];
      const filteredProducts = selectedCategoryFilter === 'Tất cả' ? products : products.filter(p => p.category === selectedCategoryFilter);

      main.innerHTML = `
        <h2>Bán Hàng & Giám Sát Đi Thị Trường</h2>
        <div class="grid">
          <div class="card">
            <h3>📍 Tuyến Điểm Bán Tới Lịch</h3>
            <div class="alert-box">⚠️ Kỷ luật Check-in: Bán kính < 30m & Mở trực tiếp Camera điện thoại.</div>
            ${stores.map(s => `
              <div style="margin-top:10px;padding-bottom:12px;border-bottom:1px solid #eee;">
                <b>${s.name}</b> <span class="badge badge-pending">${s.routeDay||'Cả tuần'}</span><br>
                <small style="color:var(--muted);">${s.address}</small><br>
                <input type="file" id="img_${s.id}" accept="image/*" capture="environment" style="margin-top:4px;">
                <div style="display:flex;gap:4px;margin-top:6px;">
                  <button class="btn btn-amber btn-sm" style="flex:1;" onclick="doCheckinWithPhoto('${s.id}')">📍 Check-in GPS (<30m)</button>
                  <button class="btn btn-green btn-sm" onclick="startQRScanner('${s.id}')">📷 Quét QR</button>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="card" style="grid-column: span 2;">
            ${activeVisitedStore ? `
              <h3>🛒 Đang Bán Hàng Tại: <span style="color:var(--amber);">${activeVisitedStore.name}</span></h3>
              
              <div class="cat-filter">
                ${categories.map(c => `<div class="cat-chip ${selectedCategoryFilter===c?'active':''}" onclick="filterCategory('${c}')">${c}</div>`).join('')}
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                <div>
                  <h4>Catalog Sản Phẩm theo ĐVT</h4>
                  <div style="max-height:350px;overflow-y:auto;margin-top:8px;">
                    ${filteredProducts.map(p => `
                      <div style="padding:8px;border-bottom:1px solid #eee;background:#fafafa;border-radius:6px;margin-bottom:6px;">
                        <b>[${p.code||'SKU'}] ${p.name}</b> <span class="badge badge-cat">${p.category||'Khác'}</span><br>
                        <small>Giá lẻ (Hộp/Chai): <b>${p.price.toLocaleString()}đ</b> | Tồn lẻ: ${p.stock}</small>
                        <div style="display:flex;gap:4px;margin-top:6px;">
                          <select id="unit_select_${p.id}" style="margin:0;padding:4px;font-size:11px;">
                            <option value="${p.baseUnit||'Hộp'}">${p.baseUnit||'Hộp/Chai'} (x1)</option>
                            <option value="Lốc">Lốc (x${p.ratePack||6})</option>
                            <option value="Thùng">Thùng (x${p.rateBox||24})</option>
                          </select>
                          <button class="btn btn-green btn-sm" onclick="addToCartWithUnit('${p.id}')">+ Chọn</button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <div>
                  <form id="ordForm" onsubmit="submitOrder(event)">
                    <input type="hidden" id="ordStore" value="${activeVisitedStore.name}">
                    <div style="background:#f0f0f0;padding:10px;border-radius:8px;margin-bottom:8px;">
                      <h4>Giỏ Hàng Chi Tiết:</h4>
                      <div id="cartList">Chưa chọn sản phẩm...</div>
                      <hr style="margin:8px 0;">
                      <div style="display:flex;justify-content:space-between;">
                        <b>Tổng Tiền:</b>
                        <b id="cartTotal" style="color:var(--red);font-size:16px;">0 đ</b>
                      </div>
                    </div>
                    <button class="btn btn-green" style="width:100%;">🚀 Khóa Đơn & Gửi Cloud</button>
                  </form>
                </div>
              </div>
            ` : `
              <div style="text-align:center;padding:40px;color:var(--muted);">
                <h3>🔒 Chưa Xác Thực Vị Trí Điểm Bán!</h3>
                <p>Vui lòng chọn nút <b>"📍 Check-in GPS (<30m)"</b> hoặc <b>"📷 Quét QR"</b> để bắt đầu bán hàng.</p>
              </div>
            `}
          </div>
        </div>
      `;
    }
    else if (currentTab === 'products' && currentUser.role === 'admin') {
      main.innerHTML = `
        <h2>Quản Lý Sản Phẩm & Quy Đổi Đơn Vị Tính</h2>
        <div class="grid">
          <div class="card">
            <h3>+ Thêm Sản Phẩm & Quy Đổi</h3>
            <form id="prdForm" onsubmit="addProduct(event)">
              <label>Mã Sản Phẩm (SKU):</label>
              <input type="text" id="prdCode" placeholder="VD: VNM-MILK-100" required>
              <label>Tên Sản Phẩm:</label>
              <input type="text" id="prdName" placeholder="VD: Sữa Tươi SuSu" required>
              <label>Phân Loại Ngành Hàng:</label>
              <select id="prdCategory">
                <option value="Hộp">Phân loại Hộp</option>
                <option value="Chai">Phân loại Chai</option>
                <option value="Lốc">Phân loại Lốc</option>
                <option value="Thùng">Phân loại Thùng</option>
                <option value="Khác">Phân loại Khác</option>
              </select>
              <label>Đơn Vị Cơ Bản (Nhỏ nhất):</label>
              <select id="prdBaseUnit">
                <option value="Hộp">Hộp</option>
                <option value="Chai">Chai</option>
                <option value="Gói">Gói</option>
              </select>
              <label>Quy đổi 1 Lốc = bao nhiêu đơn vị cơ bản?</label>
              <input type="number" id="prdRatePack" value="6" required>
              <label>Quy đổi 1 Thùng = bao nhiêu đơn vị cơ bản?</label>
              <input type="number" id="prdRateBox" value="24" required>
              <label>Đơn Giá Cơ Bản (đ):</label>
              <input type="number" id="prdPrice" placeholder="Giá 1 Hộp/Chai" required>
              <label>Tồn Kho Cơ Bản (Số Hộp/Chai):</label>
              <input type="number" id="prdStock" placeholder="VD: 2400" required>
              <button class="btn btn-green" style="width:100%;">+ Lưu Sản Phẩm</button>
            </form>
          </div>

          <div class="card" style="grid-column: span 2;">
            <h3>Danh Sách Sản Phẩm & Tỷ Lệ Quy Đổi</h3>
            <table>
              <thead><tr><th>Mã SKU</th><th>Tên SP</th><th>Phân Loại</th><th>Quy Đổi Lốc/Thùng</th><th>Giá Cơ Bản</th><th>Tồn Lẻ</th><th>Thao Tác</th></tr></thead>
              <tbody>
                ${products.map(p => `
                  <tr>
                    <td><b>${p.code||'SKU'}</b></td>
                    <td>${p.name}</td>
                    <td><span class="badge badge-cat">${p.category||'Khác'}</span></td>
                    <td><small>1 Lốc=${p.ratePack||6} | 1 Thùng=${p.rateBox||24}</small></td>
                    <td><b>${p.price.toLocaleString()}đ</b></td>
                    <td><span class="badge">${p.stock} ${p.baseUnit||'Hộp'}</span></td>
                    <td><button class="btn btn-red btn-sm" onclick="deleteProduct('${p.id}')">Xóa</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }
    else if (currentTab === 'stores') {
      main.innerHTML = `
        <h2>Quản Lý Tuyến & Điểm Bán (Tiệm)</h2>
        <div class="grid">
          <div class="card">
            <h3>+ Thêm Điểm Bán Mới</h3>
            <form id="stForm" onsubmit="addStore(event)">
              <label>Tên Cửa Hàng / Tiệm:</label>
              <input type="text" id="stName" placeholder="VD: Tạp hóa Minh Phát" required>
              <label>Địa Chỉ Chi Tiết:</label>
              <input type="text" id="stAddr" placeholder="VD: 123 Nguyễn Huệ, Q.1" required>
              <label>Tuyến Đi Lịch Trong Tần:</label>
              <select id="stRoute">
                <option value="Thứ 2 - Thứ 4 - Thứ 6">Thứ 2 - Thứ 4 - Thứ 6</option>
                <option value="Thứ 3 - Thứ 5 - Thứ 7">Thứ 3 - Thứ 5 - Thứ 7</option>
                <option value="Cả tuần">Cả tuần</option>
              </select>
              <label>Hạn Mức Công Nợ Tối Đa (VNĐ):</label>
              <input type="number" id="stCredit" value="20000000" required>
              <label>Tọa Độ Lĩnh Vực GPS Lat (Vĩ độ):</label>
              <input type="number" step="any" id="stLat" placeholder="10.7769">
              <label>Tọa Độ Lĩnh Vực GPS Lng (Kinh độ):</label>
              <input type="number" step="any" id="stLng" placeholder="106.7009">
              <button class="btn btn-green" style="width:100%;">+ Lưu Cửa Hàng</button>
            </form>
          </div>

          <div class="card" style="grid-column: span 2;">
            <h3>Danh Sách Điểm Bán Của Doanh Nghiệp</h3>
            <table>
              <thead><tr><th>Tên Điểm Bán</th><th>Địa Chỉ</th><th>Tuyến Lịch</th><th>Hạn Mức Nợ</th><th>Thao Tác</th></tr></thead>
              <tbody>
                ${stores.map(s => `
                  <tr>
                    <td><b>${s.name}</b></td>
                    <td>${s.address}</td>
                    <td><span class="badge badge-pending">${s.routeDay||'Cả tuần'}</span></td>
                    <td><b>${(s.creditLimit||0).toLocaleString()}đ</b></td>
                    <td><button class="btn btn-red btn-sm" onclick="deleteStore('${s.id}')">Xóa</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }
    else if (currentTab === 'orders') {
      main.innerHTML = `
        <h2>Danh Sách Đơn Hàng Toàn Hệ Thống</h2>
        <div class="card">
          <table>
            <thead><tr><th>Mã NV Sales</th><th>Điểm Bán</th><th>Chi Tiết Hàng</th><th>Tổng Tiền</th><th>Thanh Toán</th><th>Trạng Thái</th><th>Thao Tác</th></tr></thead>
            <tbody>
              ${orders.map(o => `
                <tr>
                  <td><b>[${o.salesCode||'NV'}]</b><br>${o.salesName||'Sales'}</td>
                  <td><b>${o.storeName}</b></td>
                  <td><small>${(o.items||[]).map(i => `${i.name} (${i.unit} x${i.qty})`).join(', ')}</small></td>
                  <td><b style="color:var(--red);">${(o.amount||0).toLocaleString()}đ</b></td>
                  <td>
                    <select onchange="updatePaymentStatus('${o.id}', this.value)" style="margin:0;padding:2px;font-size:11px;">
                      <option value="Công nợ" ${o.paymentStatus==='Công nợ'?'selected':''}>Công nợ</option>
                      <option value="Đã thanh toán" ${o.paymentStatus==='Đã thanh toán'?'selected':''}>Đã thanh toán</option>
                    </select>
                  </td>
                  <td>
                    <select onchange="updateOrderStatus('${o.id}', this.value)" style="margin:0;padding:2px;font-size:11px;">
                      <option value="Chờ duyệt" ${o.status==='Chờ duyệt'?'selected':''}>Chờ duyệt</option>
                      <option value="Đã duyệt" ${o.status==='Đã duyệt'?'selected':''}>Đã duyệt</option>
                      <option value="Đã giao hàng" ${o.status==='Đã giao hàng'?'selected':''}>Đã giao hàng</option>
                      <option value="Đã hủy" ${o.status==='Đã hủy'?'selected':''}>Đã hủy</option>
                    </select>
                  </td>
                  <td><button class="btn btn-red btn-sm" onclick="deleteOrder('${o.id}')">Xóa</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }
    else if (currentTab === 'audit' && currentUser.role === 'admin') {
      main.innerHTML = `
        <h2>Báo Cáo Nhật Ký Check-in GPS (<30m) & Watermark</h2>
        <div class="grid">
          ${checkins.map(c => `
            <div class="card">
              <b>Tiệm: ${c.storeName}</b> <span class="badge badge-success">${c.status}</span><br>
              <small>Sales: [${c.salesCode||'NV'}] ${c.salesName}</small><br>
              <small>Tọa độ: ${c.lat ? c.lat.toFixed(4) : 'N/A'}, ${c.lng ? c.lng.toFixed(4) : 'N/A'}</small>
              ${c.photo ? `<img src="${c.photo}" class="watermark-img">` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }
    else if (currentTab === 'users' && currentUser.role === 'admin') {
      main.innerHTML = `
        <h2>Quản Lý Tài Khoản Nhân Viên Sales</h2>
        <div class="grid">
          <div class="card">
            <h3>+ Tạo Tài Khoản Mới</h3>
            <form id="userForm" onsubmit="addUser(event)">
              <input type="text" id="usCode" placeholder="Mã NV (VD: NV001)" required>
              <input type="text" id="usName" placeholder="Tên NV" required>
              <input type="text" id="usUser" placeholder="Tên đăng nhập" required>
              <input type="text" id="usPass" placeholder="Mật khẩu ban đầu" required>
              <select id="usRole">
                <option value="sales">Sales Đi Thị Trường</option>
                <option value="admin">Quản Lý Admin</option>
              </select>
              <button class="btn btn-green" style="width:100%;">+ Tạo Nhân Viên</button>
            </form>
          </div>
          <div class="card" style="grid-column: span 2;">
            <h3>Danh Sách Nhân Viên</h3>
            <table>
              <thead><tr><th>Mã NV</th><th>Họ Tên</th><th>Tài Khoản</th><th>Mật Khẩu</th><th>Thao Tác</th></tr></thead>
              <tbody>
                ${users.map(u => `
                  <tr>
                    <td><b>${u.code||'NV'}</b></td>
                    <td>${u.name}</td>
                    <td>${u.username}</td>
                    <td><code>${u.password}</code></td>
                    <td><button class="btn btn-red btn-sm" onclick="deleteUser('${u.id}')">Xóa</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }
  }
</script>
</head>

<body>
<div class="app">

  <!-- LOGIN FORM -->
  <div id="loginView" class="login-box">
    <h2 style="text-align:center;margin-bottom:12px;">HỆ THỐNG DMS/SFA</h2>
    <p style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:20px;">Giám Sát Đi Thị Trường & Quản Lý Đơn Hàng</p>
    <form onsubmit="handleLogin(event)">
      <label>Tài Khoản Đăng Nhập:</label>
      <input type="text" id="logUser" placeholder="Tên đăng nhập" required>
      <label>Mật Khẩu:</label>
      <input type="password" id="logPass" placeholder="Mật khẩu" required>
      <button class="btn btn-amber" style="width:100%;padding:12px;margin-top:10px;font-size:14px;">🔑 ĐĂNG NHẬP</button>
    </form>
    <div style="margin-top:16px;padding:10px;background:#f8f8f8;border-radius:8px;font-size:11px;color:var(--muted);">
      <b>Tài khoản mẫu Admin Root:</b><br>
      User: <code>admin</code> | Pass: <code>admin123</code>
    </div>
  </div>

  <!-- MAIN APP VIEW -->
  <div id="appView" class="hidden">
    <div class="topbar">
      <div>
        <h1 style="color:var(--amber);">DMS CLOUD SFA</h1>
        <small id="userInfo">XIN CHÀO...</small>
      </div>
      <div class="nav-btns">
        <button id="navAdminDash" class="btn btn-amber hidden" onclick="switchTab('dashboard')">📊 Live Tracking</button>
        <button class="btn" onclick="switchTab('sales')">🛒 Đi Thị Trường</button>
        <button class="btn" onclick="switchTab('stores')">🏬 Tuyến / Tiệm</button>
        <button class="btn" onclick="switchTab('orders')">📦 Đơn Hàng</button>
        <button id="navAdminPrd" class="btn hidden" onclick="switchTab('products')">🥛 Sản Phẩm & Quy Đổi</button>
        <button id="navAdminAudit" class="btn hidden" onclick="switchTab('audit')">📷 Nhật Ký Check-in</button>
        <button id="navAdminUsers" class="btn hidden" onclick="switchTab('users')">👥 Nhân Viên Sales</button>
        <button class="btn btn-amber" onclick="openChangePasswordModal()">🔒 Đổi Pass</button>
        <button class="btn btn-red" onclick="handleLogout()">Đăng Xuất</button>
      </div>
    </div>

    <div class="panel" id="mainContent">
      <!-- Dữ liệu tab được render động từ JS -->
    </div>
  </div>

</div>

<!-- MODAL ĐỔI MẬT KHẨU -->
<div id="changePassModal" class="modal hidden">
  <div class="modal-content">
    <h3>🔑 Đổi Mật Khẩu Tài Khoản</h3>
    <form onsubmit="submitChangePassword(event)" style="margin-top:12px;">
      <label>Mật Khẩu Hiện Tại:</label>
      <input type="password" id="oldPassInput" required>
      <label>Mật Khẩu Mới:</label>
      <input type="password" id="newPassInput" required>
      <label>Xác Nhận Mật Khẩu Mới:</label>
      <input type="password" id="confirmPassInput" required>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button type="submit" class="btn btn-green" style="flex:1;">Lưu Thay Đổi</button>
        <button type="button" class="btn btn-red" onclick="closeChangePasswordModal()">Hủy</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL QUÉT MÃ QR -->
<div id="qrModal" class="modal hidden">
  <div class="modal-content">
    <h3>📷 Quét Mã QR Tại Điểm Bán</h3>
    <div id="reader" style="width:100%;margin-top:10px;"></div>
    <button class="btn btn-red" style="width:100%;margin-top:12px;" onclick="closeQRScanner()">Đóng Camera</button>
  </div>
</div>

</body>
</html>

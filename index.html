<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thống Quản Lý Sales Thị Trường — Enterprise</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root { --navy:#12213D; --amber:#FCA311; --paper:#F6F1E6; --line:#D9D0BC; --muted:#6B6558; --green:#2D6A4F; --red:#C1121F; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--navy);color:#1a1a1a;padding:16px;}
  .app{max-width:1200px;margin:0 auto;}
  .panel{background:var(--paper);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3);margin-top:16px;}
  h1,h2,h3,h4{font-family:'Oswald',sans-serif;color:var(--navy);}
  
  .topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;flex-wrap:wrap;gap:12px;}
  .nav-btns{display:flex;gap:8px;}
  .btn{background:var(--navy);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;}
  .btn-amber{background:var(--amber);color:var(--navy);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-sm{padding:4px 8px;font-size:12px;}
  
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
  .badge{display:inline-block;padding:3px 8px;background:#EFE7D6;border-radius:4px;font-size:12px;font-weight:700;}
  
  input, select, textarea { width:100%; padding:8px; margin:4px 0 10px; border:1px solid var(--line); border-radius:6px; font-family:inherit; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); font-size:13px; }
  th { background:#EFE7D6; color:var(--navy); }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc, serverTimestamp } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC7JD5MhzMka84JPyVG_5LbZjPz8JOnbuc",
    authDomain: "uy-phan.firebaseapp.com",
    projectId: "uy-phan",
    storageBucket: "uy-phan.firebasestorage.app",
    messagingSenderId: "387969382999",
    appId: "1:387969382999:web:772ccbb251eb4871b28112",
    measurementId: "G-K6G6Z2XEXD"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentTab = 'sales'; // 'sales', 'manager', 'stores', 'users'
  let stores = [], orders = [], users = [];

  // Đồng bộ Realtime Khách Hàng
  onSnapshot(collection(db, "stores"), (snapshot) => {
    stores = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderUI();
  });

  // Đồng bộ Realtime Đơn Hàng
  onSnapshot(collection(db, "orders"), (snapshot) => {
    orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderUI();
  });

  // Quản lý Khách Hàng (CRUD)
  window.addStore = async function(e) {
    e.preventDefault();
    const name = document.getElementById('stName').value;
    const address = document.getElementById('stAddr').value;
    await addDoc(collection(db, "stores"), { name, address, createdAt: serverTimestamp() });
    document.getElementById('stForm').reset();
  };

  window.deleteStore = async function(id) {
    if (confirm("Xóa điểm bán này khỏi hệ thống?")) {
      await deleteDoc(doc(db, "stores", id));
    }
  };

  // Quản lý Đơn Hàng (CRUD)
  window.deleteOrder = async function(id) {
    if (confirm("Bạn có chắc muốn xóa đơn hàng này?")) {
      await deleteDoc(doc(db, "orders", id));
    }
  };

  window.switchTab = function(tab) {
    currentTab = tab;
    renderUI();
  };

  function renderUI() {
    const main = document.getElementById('mainContent');
    
    if (currentTab === 'sales') {
      main.innerHTML = `
        <h2>Màn hình Sales Thị Trường</h2>
        <div class="grid">
          <div class="card">
            <h3>Danh Sách Điểm Bán Khách Hàng</h3>
            ${stores.map(s => `
              <div style="margin-top:8px;padding-bottom:8px;border-bottom:1px solid #eee;">
                <b>${s.name}</b> - <small>${s.address}</small>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    } else if (currentTab === 'stores') {
      main.innerHTML = `
        <h2>Quản Lý Điểm Bán / Khách Hàng (CRUD)</h2>
        <div class="grid">
          <div class="card">
            <h3>Thêm Điểm Bán Mới</h3>
            <form id="stForm" onsubmit="addStore(event)">
              <input type="text" id="stName" placeholder="Tên cửa hàng/quầy" required>
              <input type="text" id="stAddr" placeholder="Địa chỉ chi tiết" required>
              <button class="btn btn-green" style="width:100%;">+ Thêm Khách Hàng</button>
            </form>
          </div>
          <div class="card">
            <h3>Danh Sách Khách Hàng</h3>
            <table>
              <tr><th>Tên Quầy</th><th>Địa Chỉ</th><th>Thao Tác</th></tr>
              ${stores.map(s => `
                <tr>
                  <td><b>${s.name}</b></td>
                  <td>${s.address}</td>
                  <td><button class="btn btn-red btn-sm" onclick="deleteStore('${s.id}')">Xóa</button></td>
                </tr>
              `).join('')}
            </table>
          </div>
        </div>
      `;
    } else {
      main.innerHTML = `<h2>Màn hình Quản Lý Tổng Thể</h2>`;
    }
  }

  renderUI();
</script>
</head>
<body>

<div class="app">
  <div class="topbar">
    <h1>Tuyến Thị Trường Enterprise</h1>
    <div class="nav-btns">
      <button class="btn" onclick="switchTab('sales')">Sales</button>
      <button class="btn btn-amber" onclick="switchTab('stores')">Khách Hàng</button>
      <button class="btn btn-amber" onclick="switchTab('manager')">Báo Cáo</button>
    </div>
  </div>

  <div class="panel">
    <div id="mainContent">Đang kết nối hệ thống...</div>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12213D">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuyến Thị Trường — Cloud Firebase Realtime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root { --navy:#12213D; --amber:#FCA311; --paper:#F6F1E6; --line:#D9D0BC; --muted:#6B6558; --green:#2D6A4F; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--navy);color:#1a1a1a;padding:20px;}
  .app{max-width:1000px;margin:0 auto;}
  .panel{background:var(--paper);border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.3);}
  h1,h2,h3{font-family:'Oswald',sans-serif;color:var(--navy);}
  .topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .btn{background:var(--navy);color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:600;cursor:pointer;}
  .btn-amber{background:var(--amber);color:var(--navy);}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .badge{display:inline-block;padding:3px 8px;background:#EFE7D6;border-radius:4px;font-size:12px;font-weight:700;}
  .status-online{color:var(--green);font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .status-dot{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;}
</style>

<!-- Tải Firebase SDK Modular -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Cấu hình Firebase chuẩn cho project: uy-phan
  const firebaseConfig = {
    apiKey: "AIzaSyC7JD5MhzMka84JPyVG_5LbZjPz8JOnbuc",
    authDomain: "uy-phan.firebaseapp.com",
    projectId: "uy-phan",
    storageBucket: "uy-phan.firebasestorage.app",
    messagingSenderId: "387969382999",
    appId: "1:387969382999:web:772ccbb251eb4871b28112",
    measurementId: "G-K6G6Z2XEXD"
  };

  // Khởi tạo Firebase & Database
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentRole = 'sales';
  let checkins = [];

  // 1. Tự động đồng bộ dữ liệu Cloud theo thời gian thực (Real-time)
  onSnapshot(collection(db, "checkins"), (snapshot) => {
    checkins = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    // Sắp xếp lượt mới nhất lên đầu
    checkins.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    renderUI();
  });

  // 2. Ghi nhận Check-in và lưu trực tiếp lên Cloud Firebase
  window.doCheckin = async function(storeName) {
    if (!navigator.geolocation) {
      alert("Trình duyệt không hỗ trợ đo tọa độ GPS");
      return;
    }
    
    navigator.geolocation.getCurrentPosition(async (pos) => {
      try {
        await addDoc(collection(db, "checkins"), {
          salesName: "Nguyễn Văn An",
          storeName: storeName,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          createdAt: serverTimestamp()
        });
        alert("Đã lưu Check-in thành công lên Cloud!");
      } catch (e) {
        alert("Lỗi khi lưu dữ liệu: " + e.message);
      }
    }, () => {
      // Mô phỏng tọa độ ngẫu nhiên nếu thiết bị tắt GPS
      addDoc(collection(db, "checkins"), {
        salesName: "Nguyễn Văn An",
        storeName: storeName,
        lat: 11.5350 + (Math.random() - 0.5) * 0.01,
        lng: 106.8980 + (Math.random() - 0.5) * 0.01,
        createdAt: serverTimestamp()
      });
      alert("Đã Check-in quầy (Chế độ mô phỏng GPS)!");
    });
  };

  window.switchRole = function(role) {
    currentRole = role;
    renderUI();
  };

  // 3. Hiển thị Giao diện
  function renderUI() {
    const main = document.getElementById('mainContent');
    
    if (currentRole === 'sales') {
      main.innerHTML = `
        <h2>Màn hình Sales Đi Thị Trường</h2>
        <p style="color:var(--muted);margin-bottom:16px;">Bấm nút để lưu vị trí GPS trực tiếp lên Cloud</p>
        
        <div class="card">
          <h3>Tạp hóa Cô Ba (KH001)</h3>
          <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">12 Phú Riềng Đỏ, Đồng Xoài</p>
          <button class="btn btn-amber" onclick="doCheckin('Tạp hóa Cô Ba')">📍 Check-in GPS Quầy Này</button>
        </div>

        <div class="card">
          <h3>Siêu thị Hồng Phát (KH002)</h3>
          <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">45 Trần Hưng Đạo, Đồng Xoài</p>
          <button class="btn btn-amber" onclick="doCheckin('Siêu thị Hồng Phát')">📍 Check-in GPS Quầy Này</button>
        </div>
      `;
    } else {
      main.innerHTML = `
        <h2>Màn hình Quản Lý (Cloud Real-time)</h2>
        <p style="color:var(--muted);margin-bottom:16px;">Tự động nhảy số tức thì khi Sales bấm check-in ngoài đường</p>
        
        <div>
          ${checkins.length === 0 ? '<p>Chưa có dữ liệu check-in nào trên Cloud...</p>' : ''}
          ${checkins.map(item => `
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <strong>👤 ${item.salesName || 'Sales'}</strong>
                <span class="badge">📍 ${item.lat?.toFixed(4)}, ${item.lng?.toFixed(4)}</span>
              </div>
              <div style="margin-top:6px;font-size:14px;">Đã ghé: <strong>${item.storeName}</strong></div>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  renderUI();
</script>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div>
      <h1>Tuyến Thị Trường</h1>
      <div class="status-online"><span class="status-dot"></span> Đã kết nối Firebase: uy-phan</div>
    </div>
    <div>
      <button class="btn" onclick="switchRole('sales')">Màn hình Sales</button>
      <button class="btn btn-amber" onclick="switchRole('manager')">Màn hình Quản lý</button>
    </div>
  </div>

  <div class="panel">
    <div id="mainContent">Đang kết nối Cloud Database...</div>
  </div>
</div>

</body>
</html>

window.switchHistoryTab = function(tabName) {
  window._historyModalTab = tabName;
  const isTop = tabName === 'top';
  
  const btnTop = document.getElementById('histTabTopBtn');
  const btnDiary = document.getElementById('histTabDiaryBtn');
  if(btnTop && btnDiary) {
    btnTop.className = `btn ${isTop ? 'btn-amber' : 'btn-sm'}`;
    btnTop.style.cssText = "flex:1; font-weight:800; padding:10px;";
    btnDiary.className = `btn ${!isTop ? 'btn-amber' : 'btn-sm'}`;
    btnDiary.style.cssText = "flex:1; font-weight:800; padding:10px;";
  }

  const filterContainer = document.getElementById('historyFilterContainer');
  if (filterContainer) {
    filterContainer.style.display = isTop ? 'none' : 'block';
  }

  window._renderHistoryResultsOnly();
};

window._renderHistoryResultsOnly = function() {
  const contentEl = document.getElementById('historyScrollContent');
  if (!contentEl) return;

  const clearBtn = document.getElementById('histClearFilterBtn');
  if (clearBtn) {
    if (window._historyDateFrom !== '' || window._historyDateTo !== '') {
      clearBtn.classList.remove('hidden');
    } else {
      clearBtn.classList.add('hidden');
    }
  }

  if (!activeVisitedStore) {
      contentEl.innerHTML = '';
      return;
  }

  const storeIdStr = String(activeVisitedStore.id);
  const storeCodeStr = String(activeVisitedStore.code || '').trim();

  let customerOrders = orders.filter(o => {
    const matchId = String(o.storeId || '') === storeIdStr;
    let inferredCode = o.maDTPNNo || '';
    if (!inferredCode && o.maKH && o.maKH.includes(' - ')) {
      inferredCode = o.maKH.split(' - ')[0].trim();
    }
    const matchCode = storeCodeStr !== '' && inferredCode === storeCodeStr;
    return (matchId || matchCode) && o.status !== 'Đã hủy';
  });
  
  customerOrders.sort((a, b) => {
      const getNum = (val) => parseInt(String(val || '0').split('-')[0].replace(/[^0-9]/g, '')) || 0;
      return getNum(b.soCtu) - getNum(a.soCtu);
  });

  const isTopTab = window._historyModalTab === 'top';

  if (isTopTab) {
      let productStatsMap = new Map();
      customerOrders.forEach(o => {
        if (o.items && Array.isArray(o.items)) {
          o.items.forEach(item => {
            const itemQty = Number(item.qty || 0);
            if (itemQty > 0) {
              const pKey = String(item.id || item.code || '').trim();
              if (!productStatsMap.has(pKey)) {
                let qc = Number(item['Q/c'] || item.quyCach || item.tyleQuyDoi || item.qc || 0);
                if (qc <= 1 && item.name) {
                  const match = item.name.match(/\*(\d+)/);
                  if (match) qc = Number(match[1]);
                }
                if (qc <= 1) qc = 50; 
                productStatsMap.set(pKey, {
                  code: item.code || item.id || '',
                  name: item.name || '',
                  dvt: item.dvt || 'cây',
                  tyleQuyDoi: qc,
                  totalQty: 0,
                  orderCount: 0
                });
              }
              let stats = productStatsMap.get(pKey);
              stats.totalQty += itemQty;
              stats.orderCount += 1;
            }
          });
        }
      });

      let topProductsList = Array.from(productStatsMap.values());
      topProductsList.sort((a, b) => b.totalQty - a.totalQty);

      if (topProductsList.length === 0) {
        contentEl.innerHTML = '<div style="text-align:center; padding:30px; color:var(--text-muted); font-weight:700; flex-shrink:0;">Khách hàng chưa có lịch sử mua hàng.</div>';
        return;
      }

      let groupedByCompany = {};
      topProductsList.forEach(tp => {

window.toggleOrderAccordion = function(accId) {
  const el = document.getElementById(accId);
  const iconEl = document.getElementById(`icon_${accId}`);
  if (!el) return;
  if (el.classList.contains('hidden')) {
    el.classList.remove('hidden');
    if (iconEl) iconEl.style.transform = 'rotate(180deg)';
  } else {
    el.classList.add('hidden');

  }

window.deleteAllAndImportProductsExcel = async function(e) {
  if (!currentUser || currentUser.role !== 'admin') {
    return alert("Chỉ tài khoản Admin mới có quyền thực hiện tính năng này!");
  }

  const confirmed = await window.showCustomConfirm(
    "XÁC NHẬN XÓA TOÀN BỘ VẬT TƯ", 
    "Hành động này sẽ XÓA SẠCH toàn bộ vật tư cũ và ghi đè bằng danh sách mới từ Excel. Bạn có chắc chắn muốn tiếp tục?", 
    "fa-triangle-exclamation", 
    "Đồng ý Xóa & Tải Mới", 
    "Hủy"
  );
  if (!confirmed) return;

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.xlsx, .xls, .csv';
  fileInput.onchange = async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        // ĐỌC THEO DẠNG MẢNG (INDEX) ĐỂ TRÁNH LỖI TÊN CỘT BỊ KHOẢNG TRẮNG ẨN
        const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        if (!jsonRows || jsonRows.length <= 1) {
          return alert("File Excel không có dữ liệu!");
        }

        const uniqueMap = new Map();
        
        // Bắt đầu chạy từ dòng số 1 (bỏ qua dòng 0 là dòng tiêu đề)
        for (let i = 1; i < jsonRows.length; i++) {
          const r = jsonRows[i];
          if (!r || r.length === 0) continue; // Bỏ qua các dòng trống

          const code = r[0] ? String(r[0]).trim() : '';
          const name = r[1] ? String(r[1]).trim() : '';
          const dvt = r[2] ? String(r[2]).trim() : 'hộp';
          const priceStr = r[3] ? String(r[3]).replace(/,/g, '').trim() : '0';
          const price = Number(priceStr) || 0;
          const tyLe = Number(r[4]) || 50;
          
          // Chỉ lấy những dòng có cột A (Mã VTHH) hợp lệ
          if (code && code !== 'Ma VTHH' && code.toLowerCase() !== 'undefined') {
            uniqueMap.set(code, {
              id: code,
              code: code, 
              name: name, 
              dvt: dvt,
              price: price,
              tyLeQuyDoi: tyLe,
              updatedAt: new Date().toISOString()

            });
          }
        }

        const newProductsList = Array.from(uniqueMap.values());

        // Kiểm tra nếu không đọc được dữ liệu chặn lại ngay
        if (newProductsList.length === 0) {
            return alert("Lỗi: Không đọc được dữ liệu vật tư nào! Hãy đảm bảo Cột A chứa Mã Vật Tư.");
        }

        alert(`Đang tiến hành xóa danh mục cũ và tải lên ${newProductsList.length} vật tư mới...`);

        // 1. XÓA TOÀN BỘ DATA CŨ
        const qDeleteProd = query(collection(db, "products"), where("maDonVi", "==", window.currentWorkingTenant));
        const prodSnap = await getDocs(qDeleteProd);
        let batches = [];
        let currentBatch = writeBatch(db);
        let operationCount = 0;

        prodSnap.forEach((docSnap) => {
          currentBatch.delete(docSnap.ref);
          operationCount++;
          if (operationCount >= 400) {
            batches.push(currentBatch.commit());
            currentBatch = writeBatch(db);
            operationCount = 0;
          }
        });
        if (operationCount > 0) {
          batches.push(currentBatch.commit());
        }
        await Promise.all(batches);

        // 2. THÊM DATA MỚI VÀO
        let uploadBatches = [];
        let uploadBatch = writeBatch(db);
        let upCount = 0;

        newProductsList.forEach(p => {
          const docRef = doc(collection(db, "products"), p.id);
          uploadBatch.set(docRef, p);
          upCount++;
          if (upCount >= 400) {
            uploadBatches.push(uploadBatch.commit());
            uploadBatch = writeBatch(db);
            upCount = 0;
          }
        });
        if (upCount > 0) {
          uploadBatches.push(uploadBatch.commit());
        }
        await Promise.all(uploadBatches);

        // 3. CẬP NHẬT BIẾN LOCAL VÀ GIAO DIỆN
       // 3. CẬP NHẬT BIẾN LOCAL VÀ PHÁT TÍN HIỆU ĐỒNG BỘ
        const newVersion = Date.now();
        await setDoc(doc(db, "systemMeta", "version"), { productsVersion: newVersion }, { merge: true });
        localStorage.setItem("productsVersion", newVersion);
        
        products = newProductsList;
        await saveProductsToLocalCache(products);
        buildProductIndex();

        playSystemSound('success');
        alert(`✅ Đã xóa cũ và tải mới thành công ${products.length} mã hàng!`);
        
        // Gọi lại hàm filter để danh sách hiển thị ngay lập tức lên màn hình
        if (typeof filterTabProducts === 'function') {
            filterTabProducts('');
        }
        
      } catch (err) {
        alert("Lỗi khi xử lý file Excel: " + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  };
  fileInput.click();
};

            const s = newStoresList[i];
            
            // LỌC DỮ LIỆU RÁC: Xóa sạch các trường 'undefined' (nếu có do Excel sinh ra) để Firebase không báo lỗi 400
            const cleanData = JSON.parse(JSON.stringify(s));

            const docRef = doc(collection(db, "stores"), String(s.id));
            uploadBatch.set(docRef, cleanData);
            upCount++;

            // Khi gom đủ 400 tiệm
            if (upCount >= 400) {
                await uploadBatch.commit(); // ĐỢI Firebase lưu xong 400 tiệm này...
                uploadBatch = writeBatch(db); // ...mới tạo gói mới
                upCount = 0;
                
                // Cho hệ thống nghỉ ngơi 100ms để không bị nghẽn mạng (Anti-DDoS)
                await new Promise(resolve => setTimeout(resolve, 100)); 
            }
        }
        
        // Lưu nốt số tiệm bị lẻ ở cuối cùng
        if (upCount > 0) {
            await uploadBatch.commit();
        }
        // --- KẾT THÚC ĐOẠN CODE SỬA LẠI ---

       const newVersion = Date.now();
        await setDoc(doc(db, "systemMeta", "version"), { storesVersion: newVersion }, { merge: true });
        localStorage.setItem("storesVersion", newVersion);

        stores = newStoresList;
        await saveStoresToLocalCache(stores);
        buildStoreIndex();

        playSystemSound('success');
        alert("Đã xóa toàn bộ khách hàng cũ và tải mới thành công!");
        renderUI();
      } catch (err) {
        alert("Lỗi khi xử lý file Excel: " + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  };
  fileInput.click();
};
  window.cloneOrderToCart = function(orderId) {
  const order = orders.find(o => o.id === orderId);
  if (!order || !order.items) return alert("Không tìm thấy dữ liệu đơn!");

  let addedCount = 0;
  order.items.forEach(item => {
    const pKey = item.id || item.code;
    const qty = Number(item.qty || 0);
    
    if (qty > 0) {
      const p = products.find(x => x.id === pKey || x.code === pKey);
      const ratio = p?.tyLeQuyDoi || 50;
      
      if (!currentCart[pKey]) currentCart[pKey] = { qty: 0, kien: 0, le: 0 };
      
      // Cộng dồn vào giỏ hiện tại
      currentCart[pKey].qty += qty;
      currentCart[pKey].kien = ratio > 0 ? Math.floor(currentCart[pKey].qty / ratio) : 0;
      currentCart[pKey].le = ratio > 0 ? currentCart[pKey].qty % ratio : currentCart[pKey].qty;
      addedCount++;
    }
  });

  if (addedCount > 0) {
    saveCartDraftToLocal();
    updateCartTotalsUI();
    filterSalesProducts(productSearchKeyword); // Render lại tab hàng
    alert(`✅ Đã bốc thành công ${addedCount} mã hàng từ đơn cũ vào giỏ!`);
    closeStoreHistoryModal();
  }
};

window.filterFbStores = function(val) {
  const q = removeAccents(val.trim());
  const container = document.getElementById('fbStoreResults');
  if (!container) return;
  
  if (q === "") {
    container.classList.add('hidden');
    return;
  }

  const matched = stores.filter(s => {
    const txt = removeAccents((s.code + " " + s.name)).toLowerCase();
    return txt.includes(q);
  }).slice(0, 15);

  if (matched.length > 0) {
    container.innerHTML = matched.map(s => `
      <div onclick="selectFbStore('${s.id}', '${s.code}', '${s.name.replace(/'/g, "\\'")}')" style="padding:10px 12px; border-bottom:1px solid var(--card-border); cursor:pointer; font-size:13.5px; background:var(--card-bg);">
        <b style="color:var(--primary);">[${s.code}]</b> ${s.name}
      </div>
    `).join('');
    container.classList.remove('hidden');
  } else {
    container.innerHTML = `<div style="padding:12px; color:var(--text-muted); font-size:13px; text-align:center; background:var(--card-bg);">Không tìm thấy khách hàng!</div>`;

};

window.loadFeedbacks = async function() {
  try {
    // Thêm where
const q = query(collection(db, "feedbacks"), where("maDonVi", "==", window.currentWorkingTenant), limit(50));
const snap = await getDocs(q);
    feedbacksList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // Sắp xếp mới nhất lên đầu (xử lý offline để không bị lỗi Index Firebase)
    feedbacksList.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    renderFeedbackHistory();
  } catch (err) {
    console.error("Lỗi tải lịch sử feedback:", err);
  }
};

window.updateFeedbackStatus = async function(id, newStatus) {
  if (currentUser.role !== 'admin' && currentUser.role !== 'manager') return;
  try {
    await updateDoc(doc(db, "feedbacks", id), { status: newStatus });
    const idx = feedbacksList.findIndex(f => f.id === id);
    if (idx > -1) feedbacksList[idx].status = newStatus;
    renderFeedbackHistory();
    if (typeof triggerHaptic === 'function') triggerHaptic(20);
  } catch(e) { 
    alert("Lỗi cập nhật trạng thái: " + e.message); 
  }
};

window.deleteFeedbackItem = async function(id) {
  if (currentUser.role !== 'admin' && currentUser.role !== 'manager') return;
  const confirmDel = await window.showCustomConfirm(
    "Xóa Phản Hồi", 
    "Bạn có chắc chắn muốn xóa vĩnh viễn phản hồi này không?", 
    "fa-trash", 
    "Xóa ngay", 
    "Hủy"
  );
  if (!confirmDel) return;

  try {
    await deleteDoc(doc(db, "feedbacks", id));
    feedbacksList = feedbacksList.filter(f => f.id !== id);
    renderFeedbackHistory();
    if (typeof triggerHaptic === 'function') triggerHaptic(30);
  } catch(e) { 
    alert("Lỗi khi xóa: " + e.message); 
  }
};

window.submitSalesFeedback = async function(e) {
  e.preventDefault();
  const storeId = document.getElementById('fbStoreSelectedId').value;
  const storeInputVal = document.getElementById('fbStoreSearchInput').value;
  const fbType = document.getElementById('fbTypeSelect').value;
  const note = document.getElementById('fbNote').value.trim();

  if (!storeId || !storeInputVal) return alert("Vui lòng chọn khách hàng cần phản hồi từ danh sách tìm kiếm!");
  if (!note) return alert("Vui lòng nhập nội dung chi tiết!");

  const targetStore = stores.find(s => String(s.id) === String(storeId));
  const newFbData = {
    maDonVi: window.currentWorkingTenant,
    storeId: storeId,
    storeCode: targetStore ? targetStore.code : 'KH',
    storeName: targetStore ? targetStore.name : storeInputVal,
    type: fbType,
    note: note,
    salesUid: currentUser.uid,
    salesName: currentUser.name,
    salesCode: currentUser.code,
    lat: currentSalesGPS?.lat || 0,
    lng: currentSalesGPS?.lng || 0,
    status: 'Mới',
    createdAt: new Date().toISOString()
  };

  try {
    const fbBtn = document.getElementById('fbSubmitBtn');
    fbBtn.disabled = true;
    fbBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang gửi...';
    
  // KHẮC PHỤC LỖI ID: Tạo ID cố định và ép Firebase lưu đúng ID này
    const realId = 'fb_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7); 
    const docRef = doc(db, "feedbacks", realId);

    // Dùng setDoc thay vì addDoc để CSDL và Màn hình chung 1 ID
    setDoc(docRef, { ...newFbData, serverTimestamp: serverTimestamp() })
      .catch(e => console.log("Lưu feedback offline", e));

    feedbacksList.unshift({ id: realId, ...newFbData });
    renderFeedbackHistory();

    alert("✅ Đã gửi phản hồi lên hệ thống thành công!");
    document.getElementById('fbNote').value = '';
    document.getElementById('fbStoreSelectedId').value = '';
    document.getElementById('fbStoreSearchInput').value = '';
    if (typeof triggerHaptic === 'function') triggerHaptic(30);
  } catch (err) {
    alert("Lỗi khi gửi phản hồi: " + err.message);
  } finally {
    const fbBtn = document.getElementById('fbSubmitBtn');
    if (fbBtn) {
      fbBtn.disabled = false;
      fbBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> GỬI PHẢN HỒI THỊ TRƯỜNG';
    }
  }
};

            <b>5. Gợi ý Toa Chủ Động:</b> Không hỏi "Cô lấy gì?". Hãy nói: <i>"Cô Tư ơi, kệ mỳ tôm nhà mình thủng rồi, cháu bù 5 thùng Hảo Hảo với 2 thùng Omachi bán cuối tuần nhé."</i><br><br>
            <b>6. Bán chéo (Cross-selling):</b> Tận dụng rổ hàng 60 công ty. <i>"Cô lấy mỳ rồi, cháu lên thêm dây xúc xích với khay trứng cút ăn liền của hãng X nhé, khách mua mỳ hay mua kèm lắm."</i><br><br>
            <b>7. Đẩy hàng & Chốt KM (Upsell):</b> <i>"Toa này 18 thùng rồi, lấy ráng 2 thùng nước mắm nữa đủ 20 thùng cháu áp mã tặng cô cái xô nhựa cao cấp."</i><br><br>
            <b>8. Chốt đơn & Tạm biệt:</b> Đọc lại toa rõ ràng. Hẹn lịch xe tải ngày mai giao hàng.
          </div>
        </div>

            <b>1. Nguyên tắc Eye-Level (Ngang tầm mắt):</b> Vị trí từ ngực đến mắt khách hàng là "vị trí kim cương". Luôn ưu tiên xin bày hàng chủ lực, hàng KM vào khu vực này.<br><br>

            <b>3. Block Trưng Bày:</b> Trưng bày theo cụm cùng ngành hàng, cùng nhà sản xuất. Ví dụ: Góc nhà tắm (Dầu gội xếp cạnh sữa tắm, bột giặt), Góc nhà bếp (Nước mắm cạnh tương ớt, bột ngọt).<br><br>

            <div style="font-size:14px; font-weight:800; color:var(--text-main);"><i class="fa-solid fa-bullseye" style="color:#64748B;"></i> Bài 9: Quản Trị Mục Tiêu & Phân Loại Tuyến</div>

          <div id="hb9" class="hidden" style="padding:16px; border-top:1px solid var(--card-border); font-size:13.5px; line-height:1.6; color:var(--text-main); background:var(--card-bg);">
            <div style="background:rgba(100, 116, 139, 0.1); padding:10px; border-radius:8px; margin-bottom:12px; font-weight:700; color:#334155;">Sales giỏi không phải chạy nhiều, mà là biết dồn sức vào đâu để ra số hiệu quả nhất.</div>
            <b>1. Nghệ thuật Nhỏ hóa Mục tiêu (Breakdown KPI):</b><br>
            Sếp giao chỉ tiêu 300 triệu/tháng, nghe rất ngợp. Hãy bẻ nhỏ nó ra:<br>
            - 1 tháng làm việc 25 ngày ➡️ Mỗi ngày phải đạt 12 triệu.<br>
            - Một ngày đi 40 tiệm ➡️ Mỗi tiệm chỉ cần chốt toa 300 ngàn.<br>
            <i>Tư duy: Hôm nay không bán được 300 triệu, nhưng chắc chắn ép được mỗi tiệm mua thêm 300 ngàn.</i><br><br>
            <b>2. Phân loại Khách hàng (A-B-C):</b><br>
            - <b>Tiệm loại A (Siêu thị mini, Tạp hóa lớn):</b> Tần suất nhập cao. Dành 60% thời gian ở đây để dập CTKM lớn, mời sản phẩm mới, kiểm tra tồn kho kỹ.<br>
            - <b>Tiệm loại B (Vừa):</b> Dành 30% thời gian, duy trì đều đặn các mặt hàng chủ lực.<br>
            - <b>Tiệm loại C (Nhỏ lẻ, bán nước vỉa hè):</b> Đừng tốn quá nhiều thời gian nói chuyện phiếm, vào quét mắt nhanh, hỏi bù hàng thiếu rồi đi tiếp.<br><br>
            <b>3. Kỷ luật Tuyến (Routing):</b> Tuyệt đối không nhảy cóc tuyến. Đi đúng sơ đồ tuyến giúp tối ưu tiền xăng, phủ kín thị trường và giữ đúng nhịp độ thăm hỏi khách hàng (thường là 1 lần/tuần).
          </div>
        </div>

            <div style="background:rgba(6, 182, 212, 0.1); padding:10px; border-radius:8px; margin-bottom:12px; font-weight:700; color:#0891B2;">Trong ngành hàng tiêu dùng, sản phẩm các hãng na ná nhau, giá chênh lệch vài ngàn. Cuối cùng, khách hàng chọn lấy hàng vì HỌ THÍCH BẠN.</div>
            <b>1. Quy tắc 3B (Bạn - Bàn - Bán):</b><br>

            <div style="border-left:3px solid #4F46E5; padding-left:10px; margin-bottom:12px;"><b>Sai lầm chết người:</b> Chối bỏ trách nhiệm, đổ lỗi cho tài xế giao hàng hoặc đổ lỗi cho kế toán công ty. Điều này làm mất hình ảnh chuyên nghiệp của cả Hệ thống.</div>

        <!-- BÀI 15: TƯ DUY CHIẾN BINH SALES -->

            <div style="background:rgba(30, 41, 59, 0.1); padding:10px; border-radius:8px; margin-bottom:12px; font-weight:700; color:#0F172A;">Nghề Sales đi thị trường là nghề của những cái lắc đầu. Người trụ lại cuối cùng không phải là người khéo mồm nhất, mà là người lì đòn nhất.</div>
            <b>1. Khách hàng không từ chối BẠN:</b><br>
            Khi chủ tiệm xua tay gắt gỏng: "Nay không lấy gì đâu đi đi!", đừng tự ái. Họ đang bực bội vì chuyện gia đình, vì mất đồ, hoặc vì đang mệt. Hãy mỉm cười: <i>"Dạ cô đang dở tay thì cháu xin phép đi tuyến khác, thứ 3 tuần sau cháu lại ghé cô nha."</i> Hãy nhớ, họ từ chối sản phẩm tại thời điểm đó, không phải ghét bỏ con người bạn.<br><br>
            <b>2. Quy luật Bình Quân (Law of Averages):</b><br>
            Mọi thứ đều là Xác suất. Bạn chào 10 tiệm -> 5 tiệm cho phép bạn kiểm kê kệ hàng -> 3 tiệm chịu nghe bạn báo giá -> 1 tiệm chốt đơn. <br>
            Nếu hôm nay bị từ chối 9 lần, hãy ăn mừng, vì tiệm thứ 10 chắc chắn sẽ nổ đơn. Việc của bạn là phải đi đủ số lượng tiệm trong ngày.<br><br>
            <b>3. Bán hàng là gieo hạt:</b><br>
            Hôm nay bạn mời 1 mặt hàng mới, khách lắc đầu. Đừng buồn. Đó là quá trình "Gieo". Tuần sau bạn mời lại, khách bắt đầu nhớ. Tuần thứ 3 bạn mời, vô tình có 1 người tiêu dùng vừa hỏi mua món đó. BÙM! Khách gật đầu nhập hàng. Thiếu kiên nhẫn, bạn sẽ mất toàn bộ công sức gieo hạt vào tay người đến sau.

          <div onclick="toggleHandbookAccordion('hb16')" style="padding:14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; background:var(--panel-bg);">
            <div style="font-size:14px; font-weight:800; color:var(--text-main);"><i class="fa-solid fa-sack-dollar" style="color:#F59E0B;"></i> Bài 16: Không Bán Hàng - Hãy Bán "Lợi Nhuận"</div>
            <i id="icon_hb16" class="fa-solid fa-chevron-down" style="color:var(--text-muted); transition:0.3s;"></i>
          </div>
          <div id="hb16" class="hidden" style="padding:16px; border-top:1px solid var(--card-border); font-size:13.5px; line-height:1.6; color:var(--text-main); background:var(--card-bg);">
            <div style="background:rgba(245, 158, 11, 0.1); padding:10px; border-radius:8px; margin-bottom:12px; font-weight:700; color:#B45309;">Chủ tiệm không quan tâm sản phẩm của bạn ngon thế nào, họ chỉ quan tâm bán nó họ đút túi được bao nhiêu tiền. Đừng nói về tính năng, hãy nói về con số!</div>
            <b>1. Bài toán Biên lợi nhuận (Margin):</b><br>
            Khi khách chê hàng mới giá nhập cao. <i>"Dạ đúng giá nhập bên cháu cao hơn 10k/thùng. Nhưng giá bán lẻ niêm yết cũng cao hơn đối thủ. Bán 1 thùng bên kia cô lời 20k, nhưng bán 1 thùng bên cháu cô lời tới 35k. Tội gì không bán hàng bên cháu để bỏ túi nhiều hơn hả cô?"</i><br><br>
            <b>2. Bài toán Vòng quay vốn (Turnover Rate):</b><br>
            Khi khách so sánh với hàng rẻ tiền, trôi nổi: <i>"Hàng rẻ đó cô bán 1 thùng lời 50k, nhưng 1 tháng mới có người mua. Hàng bên cháu thương hiệu mạnh, cô bán 1 thùng lời 20k thôi, nhưng 1 tuần bán vèo hết 3 thùng. Tính ra 1 tháng hàng cháu mang về cho cô 60k tiền lời, lại thu hồi vốn liên tục. Cô nhẩm xem cái nào lợi hơn?"</i><br><br>
            <b>3. Chốt hạ bằng vị thế Cố vấn:</b><br>
            <i>"Cháu đi thị trường cả trăm tiệm, thấy tiệm nào làm ăn khấm khá cũng đều áp dụng công thức xoay vòng vốn nhanh này. Nên cháu mới chân thành khuyên cô vô toa này để tối ưu tiền lời đấy ạ."</i>
          </div>
        </div>

        <!-- BÀI 17: BẺ GÃY THẾ ĐỘC QUYỀN CỦA ĐỐI THỦ -->
        <div class="mobile-item-card" style="padding:0; overflow:hidden; border-left:4px solid #10B981;">
          <div onclick="toggleHandbookAccordion('hb17')" style="padding:14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; background:var(--panel-bg);">
            <div style="font-size:14px; font-weight:800; color:var(--text-main);"><i class="fa-solid fa-lock-open" style="color:#10B981;"></i> Bài 17: Phá Băng Khi Bị Đối Thủ "Bao Nuôi" Tiệm</div>
            <i id="icon_hb17" class="fa-solid fa-chevron-down" style="color:var(--text-muted); transition:0.3s;"></i>
          </div>
          <div id="hb17" class="hidden" style="padding:16px; border-top:1px solid var(--card-border); font-size:13.5px; line-height:1.6; color:var(--text-main); background:var(--card-bg);">
            <div style="border-left:3px solid #10B981; padding-left:10px; margin-bottom:12px;">Từ chối hóc búa nhất: "Cô lỡ nhận Tủ lạnh / Bảng hiệu của hãng X rồi, sale bên đó cấm cô bán hàng của bên em."</div>
            <b>1. Đồng cảm & Tháo gỡ tâm lý tội lỗi:</b><br>
            Tuyệt đối không chê bai hãng đối thủ làm vậy là ích kỷ. <br>
            <i>"Dạ cháu hiểu, người ta hỗ trợ mình cái tủ lạnh thì mình ưu tiên trưng hàng cho người ta là đúng rồi cô ạ, chữ tín làm đầu mà."</i><br><br>
            <b>2. Dịch chuyển không gian trưng bày (Lách luật):</b><br>
            <i>"Tủ/kệ của họ thì cô cứ bày hàng của họ cho họ chụp hình báo cáo. Còn hàng bên cháu, cô đâu cần bày tủ đó! Cô cứ lấy 1 thùng để dưới sạp, hoặc để trong quầy kính này. Khách hàng giờ 9 người 10 ý, vô hỏi mua hàng bên cháu mà cô nói không có là mất khách, mất tiền. Tiệm nhà mình là đất của mình, tội gì từ chối tiền khách đưa hả cô?"</i><br><br>
            <b>3. Mũi khoan nhỏ đục tường lớn:</b><br>
            Đừng cố ép họ nhập toa lớn ngay lập tức để đối đầu với hãng X. Hãy đưa vào trước 1-2 mã sản phẩm "ngách" mà hãng X không có hoặc làm rất dở. Dần dần chiếm lại lòng tin và mở rộng diện tích trưng bày (Share of Shelf).
          </div>
        </div>

        <!-- BÀI 18: BÁN HÀNG BẰNG DỮ LIỆU (DATA-DRIVEN SALES) -->
        <div class="mobile-item-card" style="padding:0; overflow:hidden; border-left:4px solid #6366F1;">

            <div style="font-size:14px; font-weight:800; color:var(--text-main);"><i class="fa-solid fa-chart-simple" style="color:#6366F1;"></i> Bài 18: Ép Số Bằng Dữ Liệu DMS (Data-Driven)</div>

          </div>
          <div id="hb18" class="hidden" style="padding:16px; border-top:1px solid var(--card-border); font-size:13.5px; line-height:1.6; color:var(--text-main); background:var(--card-bg);">
            <div style="background:rgba(99, 102, 241, 0.1); padding:10px; border-radius:8px; margin-bottom:12px; font-weight:700; color:#4338CA;">Lời nói gió bay, nhưng con số trên App DMS là bằng chứng đanh thép nhất để chốt một đơn hàng lớn mà khách không thể cãi.</div>
            <b>1. Dùng Lịch sử mua hàng để ép lượng (Volume):</b><br>
            Khách dè dặt: "Thôi nay cho cô 5 thùng mắm thôi".<br>
            Sales mở App, bấm tab Lịch sử: <i>"Cô Tư xem này, đúng ngày mùng 5 tháng trước cô lấy 10 thùng. Tới ngày 15 cô hết sạch gọi cháu châm thêm. Lịch sử hệ thống báo tiệm nhà mình bán 10 ngày hết 10 thùng. Hôm nay mùng 1, cháu lên luôn 15 thùng để cô bán xuyên giữa tháng không lo đứt hàng mất mối nhé!"</i><br><br>
            <b>2. Dùng sức mạnh tổng hợp của tiệm lân cận (Social Proof):</b><br>
            Khách nghi ngờ hàng mới bán chậm.<br>
            Sales mở App cho xem các đơn trong ngày: <i>"Cháu thề với cô mã bánh này đang cháy hàng. Cô nhìn sổ gốc trên App cháu sáng nay đi nè: Bà Sáu lấy 3 lốc, tiệm ông Tám đầu ngõ lấy 5 lốc. Họ gom hết sạch rồi, cháu còn đúng 2 lốc cuối trên xe để phần cô đấy, cô không lấy mai ông Tám bán hết ráng chịu nha."</i><br><br>
            <b>3. Chốt bằng sự chuyên nghiệp:</b><br>
            Tiệm tạp hóa thường quản lý bằng trí nhớ, họ rất mơ hồ về số liệu. Khi bạn chỉ cho họ thấy chính xác tháng trước họ lấy bao nhiêu tiền, bán chạy mã nào nhất, họ sẽ nể trọng bạn như một "Kiểm toán viên". Lòng tin được tạo ra từ sự minh bạch của dữ liệu!
          </div>
        </div>
        <!-- BÀI 19: NGHỆ THUẬT ĐÒI NỢ KHÉO (QUẢN TRỊ CÔNG NỢ) -->

            <div style="font-size:14px; font-weight:800; color:var(--text-main);"><i class="fa-solid fa-file-invoice-dollar" style="color:#9333EA;"></i> Bài 19: Nghệ Thuật Đòi Nợ Khéo (Không Mất Lòng)</div>

          <div id="hb19" class="hidden" style="padding:16px; border-top:1px solid var(--card-border); font-size:13.5px; line-height:1.6; color:var(--text-main); background:var(--card-bg);">
            <div style="background:rgba(147, 51, 234, 0.1); padding:10px; border-radius:8px; margin-bottom:12px; font-weight:700; color:#7E22CE;">Bán được hàng là giỏi, thu được tiền về mà khách vẫn vui vẻ mua tiếp mới là Xuất sắc. Nguyên tắc: Đòi nợ phải đi kèm với Quyền lợi.</div>
            <b>1. Phương pháp "Bánh mỳ kẹp thịt" (Khen ngợi - Đòi tiền - Khuyến mãi):</b><br>

            <b>2. Nghệ thuật "Mượn dao giết người" (Đổ lỗi cho hệ thống):</b><br>
            Hãy đóng vai người tốt (Good Cop), để hệ thống App làm kẻ xấu (Bad Cop).<br>
            <i>"Cháu thì thoải mái với cô thôi, nhưng hệ thống App của công ty cứ quá hạn 7 ngày là nó tự động khóa mã khóa luôn cả khuyến mãi. Cháu nài nỉ kế toán mãi không được, cô giúp cháu thanh toán toa cũ để mã của cô được mở lại, cháu mới lên đơn mới chèn KM cho cô được ạ."</i><br><br>
            <b>3. Chia nhỏ để thu:</b><br>
            Nếu khách thực sự kẹt số tiền lớn (VD 10 triệu): <i>"Dạ cô kẹt thì hôm nay cô xoay giúp cháu 4 triệu trước để cháu nộp số về công ty báo cáo. Cuối tuần cháu ghé cô gửi nốt phần kia giúp cháu nhé."</i>
          </div>
        </div>

        <!-- BÀI 20: ĐỌC VỊ TÂM LÝ CHỦ TIỆM -->
        <div class="mobile-item-card" style="padding:0; overflow:hidden; border-left:4px solid #0D9488;">

            <div style="border-left:3px solid #0D9488; padding-left:10px; margin-bottom:12px;">Đừng dùng 1 bài thuyết trình cho 100 người. Bạn phải biết "Chameleons" (Biến hình) theo tính cách chủ tiệm.</div>
            <b>1. Kiểu người "Sởi lởi, thích buôn chuyện":</b><br>
            Họ mua hàng dựa trên cảm xúc và mối quan hệ. Đừng nhảy vào báo giá ngay. Hãy khen tiệm sạch sẽ, khen con cái họ giỏi, đứng tám chuyện 5-10 phút. Khi họ đã quý bạn, chỉ cần nói: <i>"Cô thương cháu thì ủng hộ cháu toa này để cháu đủ số tháng nha"</i> là chốt đơn dễ dàng.<br><br>
            <b>2. Kiểu người "Lạnh lùng, Kẻ tính toán":</b><br>
            Họ hay nhăn nhó, soi giá từng đồng, ghét nói chuyện phiếm. Đối với họ, hãy cắt bỏ rườm rà. Lấy App ra show ngay con số: <i>"Anh nhập mã này đi, giá nhập 100k, thị trường đang bán 120k, anh lời 20%. Date tới tận năm sau. Lấy không anh?"</i> Trực diện, nhanh gọn, chuyên nghiệp.<br><br>
            <b>3. Kiểu người "Bề trên, cái gì cũng biết":</b><br>
            Họ hay dạy đời Sales, chê bai hãng này hãng nọ. Tuyệt đối không cãi. Hãy xoa dịu cái tôi của họ: <i>"Dạ cô nói quá chuẩn, đi cả tuyến này không ai sành sỏi thị trường như cô. Theo kinh nghiệm của cô thì đợt này công ty cháu ra gói KM này đã ổn chưa ạ, cô góp ý để cháu báo cáo Sếp với."</i> Hãy nhường họ thắng trong câu chuyện, bạn sẽ thắng được đơn hàng.
          </div>
        </div>

        <!-- BÀI 21: QUY LUẬT 80/20 TRONG PHÂN PHỐI ĐA NGÀNH -->
        <div class="mobile-item-card" style="padding:0; overflow:hidden; border-left:4px solid #CA8A04;">

            <div style="background:rgba(202, 138, 4, 0.1); padding:10px; border-radius:8px; margin-bottom:12px; font-weight:700; color:#854D0E;">Bạn có 60 công ty với hàng ngàn mã sản phẩm. Nếu bạn vào tiệm và chào từng sản phẩm, khách sẽ tẩu hỏa nhập ma và đuổi bạn đi.</div>
            <b>1. Hiểu đúng quy luật 80/20:</b><br>
            20% mã sản phẩm (Mì Hảo Hảo, Dầu ăn Tường An, Bột giặt Omo...) sẽ mang lại 80% doanh thu. Nhưng 80% các mã sản phẩm ngách (Bánh kẹo lạ, Gia vị đặc biệt...) mới là thứ mang lại BIÊN LỢI NHUẬN cao nhất cho bạn và công ty.<br><br>
            <b>2. Cách Chào Hàng Thông Minh:</b><br>
            - <b>Bước 1 (Dùng 20% làm Móc Câu):</b> Luôn chào các mã "Key SKU" (hàng thiết yếu) trước để làm mồi. <i>"Cô Tư, cháu lên 5 thùng Hảo Hảo, 2 mắm, 2 xì dầu bù vô kệ đang trống nha."</i> Những mã này bán bằng tiềm thức, chốt trong 1 nốt nhạc.<br>
            - <b>Bước 2 (Bán 80% hàng Lợi Nhuận):</b> Sau khi toa đã hòm hòm, tâm lý khách đang mở, lúc này mới tung hàng ngách, hàng mới. <i>"Sẵn xe mai giao mỳ, cháu nhét thêm 1 lốc kẹo Thái này vô, ăn lời dữ lắm, cô bán để kiếm thêm tiền đi chợ chứ mấy mỳ tôm kia lời có mấy ngàn lấy tương tác thôi cô."</i><br><br>
            <b>3. Chú ý:</b> Đừng bao giờ vào tiệm và nói <i>"Nay công ty cháu có kẹo này mới ngon lắm cô lấy không?"</i> Bạn sẽ bị từ chối ngay lập tức. Luôn đi từ hàng "Bắt Buộc Phải Có" sang hàng "Có Thể Mua Thêm".
          </div>
        </div>
        <!-- BÀI 22: CHIẾN THUẬT LẤN CHIẾM KHÔNG GIAN KỆ (SHARE OF SHELF) -->

            <div style="background:rgba(5, 150, 105, 0.1); padding:10px; border-radius:8px; margin-bottom:12px; font-weight:700; color:#047857;">Trên kệ tạp hóa, "Tấc đất là tấc vàng". Hàng của bạn chiếm 60% diện tích kệ, doanh số của bạn sẽ tự động đạt 60% của tiệm đó.</div>
            <b>1. Quy tắc "Mưa dầm thấm lâu":</b><br>
            Đừng xin chủ tiệm một lúc nửa cái kệ, họ sẽ từ chối. Mỗi lần ghé thăm, khi vệ sinh và kéo hàng ra (FIFO), hãy "vô tình" nới rộng hàng của mình ra thêm nửa gang tay, đẩy hàng của đối thủ (đang bán chậm, bám bụi) xích lại gần nhau hoặc lùi ra phía sau.<br><br>
            <b>2. Dùng hàng KM để chiếm "Ụ":</b><br>
            Khi tiệm mua đơn lớn được tặng kèm thau, chậu, rổ... Đừng để chủ tiệm cất đi. Hãy chủ động mượn vật phẩm KM đó làm "Ụ trưng bày" chà bá ngay giữa nhà. <i>"Cô Tư để cháu lấy cái rổ KM này xếp tháp bánh kẹo lên, đặt ngay lối đi cho khách dễ bốc nha."</i> Bạn vừa lấp đầy không gian tiệm, đối thủ vào sau không còn chỗ đứng.<br><br>
            <b>3. Khóa kệ bằng 60 Nhãn Hàng:</b><br>
            Bạn có lợi thế khổng lồ là phân phối 60 công ty. Hãy gộp các sản phẩm lại thành một "Góc Siêu Thị Thu Nhỏ" của riêng bạn. <i>"Cô dồn hết mắm, muối, tương ớt, dầu ăn của bên cháu vào chung 1 mâm này đi, nhìn nó đồng bộ y như trong Bách Hóa Xanh, khách vô mua tiện tay nhặt đủ bộ luôn."</i>

  window._chiTieuSubTab = tabName;

};

// Hàm phụ trợ Format thời gian sang Tiếng Việt
function formatMonthVN(yyyy_mm) {
  if(!yyyy_mm) return "";
  const parts = yyyy_mm.split('-');
  return `Tháng ${Number(parts[1])} năm ${parts[0]}`;
}

// Hàm format số gọn gàng
function formatQtySmart(num) {
  const val = Number(num || 0);
  return Number.isInteger(val) ? val.toString() : val.toFixed(1);
}

// Chuyển tháng nhanh (Tiến/Lùi)
window.changeChiTieuMonthStep = function(offset) {
  const parts = window._chiTieuTargetMonth.split('-');
  let y = parseInt(parts[0], 10);
  let m = parseInt(parts[1], 10) + offset;
  if (m > 12) { m = 1; y++; }
  else if (m < 1) { m = 12; y--; }
  window._chiTieuTargetMonth = `${y}-${String(m).padStart(2, '0')}`;
  renderChiTieuTab(document.getElementById('tabPane_chiTieu'));
};

function getCompCodeFromProductCode(code) {
  let pCodeStr = String(code || '').toUpperCase();
  if (pCodeStr.startsWith('11') || pCodeStr.includes('TLSG')) return '11';
  let match = pCodeStr.match(/^\[(.*?)\]/);
  if (match) return match[1].trim();
  let parts = pCodeStr.split(/[-_]/);
  if (parts.length > 1) return parts[0].trim();
  if (pCodeStr.length >= 2) return pCodeStr.substring(0, 2);
  return 'KHAC';
}

            // --- THUẬT TOÁN QUÉT DỮ LIỆU TUYẾN TOÀN CÔNG TY REAL-TIME ---
            let routeOwnership = {};
            salesUsersList.forEach(u => {
                if (u.active === false) return;

window.forceRefreshKpi = async function() {
    const btn = document.getElementById('btnForceRefreshKpi');
    if (btn) {
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG CẬP NHẬT...';
        btn.disabled = true;
    }

    try {
        const currentMonth = window._chiTieuTargetMonth;
        
        if (!window._cachedKpiOrders[currentMonth]) {
            // LẦN TẢI ĐẦU TIÊN CỦA THÁNG: Tải toàn bộ để làm móng dữ liệu
            const startOfMonth = currentMonth + "-01";
            const endOfMonth = currentMonth + "-31";
            const q = query(collection(db, "orders"), 
                where("ngayCtu", ">=", startOfMonth), 
                where("ngayCtu", "<=", endOfMonth)
            );
            const mSnap = await getDocs(q);
            window._cachedKpiOrders[currentMonth] = mSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            // Lưu lại mốc thời gian vừa tải xong
            localStorage.setItem(`dms_kpi_last_sync_${currentMonth}`, new Date().toISOString());
        } else {
            // CÁC LẦN TẢI SAU: Đồng bộ gia tăng tuyệt đối chính xác (Timestamp Sync)
            const lastSyncTime = localStorage.getItem(`dms_kpi_last_sync_${currentMonth}`) || "2000-01-01T00:00:00.000Z";
            
            // Lấy các đơn hàng MỚI ĐƯỢC TẠO SAU mốc lastSyncTime
            const qNew = query(collection(db, "orders"), 
                where("ngayCtu", ">=", currentMonth + "-01"),
                where("ngayCtu", "<=", currentMonth + "-31"),
                where("createdAt", ">", new Date(lastSyncTime))
            );
            const snapNew = await getDocs(qNew);
            
            // Lấy các đơn hàng CŨ BỊ SỬA LẠI SAU mốc lastSyncTime
            const qEdited = query(collection(db, "orders"), 
                where("ngayCtu", ">=", currentMonth + "-01"),
                where("ngayCtu", "<=", currentMonth + "-31"),
                where("updatedAt", ">", new Date(lastSyncTime))
            );
            const snapEdited = await getDocs(qEdited);
            
            // Gom chung đơn mới và đơn bị sửa lại
            let changedOrders = [];
            snapNew.forEach(d => changedOrders.push({ id: d.id, ...d.data() }));
            snapEdited.forEach(d => {
                // Kiểm tra trùng lặp giữa 2 truy vấn
                if (!changedOrders.find(o => o.id === d.id)) {
                    changedOrders.push({ id: d.id, ...d.data() });
                }
            });
            
            // Gộp (Merge) vào cache hiện tại của tháng
            let cachedList = window._cachedKpiOrders[currentMonth];
            changedOrders.forEach(newOrd => {
                const idx = cachedList.findIndex(o => o.id === newOrd.id || o.soCtu === newOrd.soCtu);
                if (idx > -1) {
                    cachedList[idx] = newOrd; // Ghi đè đơn cũ vừa bị Edit
                } else {
                    cachedList.push(newOrd); // Bổ sung đơn mới tinh
                }
            });
            
            // Cập nhật lại mốc thời gian mới nhất
            localStorage.setItem(`dms_kpi_last_sync_${currentMonth}`, new Date().toISOString());
            
            // Bộ lọc cuối: Loại bỏ các đơn đã bị Hủy để KPI chính xác
            window._cachedKpiOrders[currentMonth] = cachedList.filter(o => o.status !== 'Đã hủy');
            await saveKpiOrdersToLocal(currentMonth, window._cachedKpiOrders[currentMonth]);
        }

        // Gọi lại hàm vẽ biểu đồ KPI
        await calculateAndRenderTargets();

        if (typeof playSystemSound === 'function') playSystemSound('success');
        if (typeof triggerHaptic === 'function') triggerHaptic(30);
    } catch (error) {
        console.error("Lỗi làm mới KPI:", error);
        
        // CẢNH BÁO BẢO MẬT FIREBASE INDEX:
        // Lần đầu chạy có thể Firebase yêu cầu tạo Composite Index (Bảng mục lục ghép)
        if (error.message.includes("requires an index")) {
            alert("⚠️️ Cảnh báo từ máy chủ: Vui lòng mở F12 (Console), copy đường link xanh dương của Firebase dán vào trình duyệt để tạo Index đồng bộ dữ liệu. Chờ 5 phút sau đó F5 tải lại là hệ thống sẽ chạy mượt vĩnh viễn!");
        } else {
            alert("Lỗi khi tải dữ liệu mới: " + error.message);
        }
    } finally {
        if (btn) {
            btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> LÀM MỚI';
            btn.disabled = false;
        }
    }
};
window.deleteAllKpiForCurrentMonth = async function() {
    if (!currentUser || (currentUser.role !== 'admin' && currentUser.role !== 'manager')) {
        return alert("⛔ Chỉ quản lý mới có quyền xóa toàn bộ chỉ tiêu!");
    }

    const currentMonth = window._chiTieuTargetMonth;
    const confirmText = prompt(`⚠️ CẢNH BÁO NGUY HIỂM:\nBạn đang chuẩn bị XÓA SẠCH VĨNH VIỄN toàn bộ dữ liệu KPI của TẤT CẢ nhân viên trong tháng ${currentMonth}!\nHành động này không thể hoàn tác.\n\nGõ chữ "XOAKPI" viết hoa vào ô dưới để xác nhận:`);
    
    if (confirmText !== 'XOAKPI') {
        return alert("❌ Thao tác đã bị hủy bỏ.");
    }

    try {
        const targetsSnap = await getDocs(collection(db, "monthlyTargets"));
        const batch = writeBatch(db);
        let count = 0;

        // Thêm điều kiện xóa để chỉ xóa của đơn vị mình
targetsSnap.forEach(docSnap => {
    const data = docSnap.data();
    if (data && data.month === currentMonth && data.maDonVi === window.currentWorkingTenant) { // ✅ Đã sửa
        batch.delete(docSnap.ref);
        count++;
    }
});

        if (count === 0) {
            return alert(`Không tìm thấy dữ liệu KPI nào trong tháng ${currentMonth} để xóa.`);
        }

        await batch.commit();
        if (typeof playSystemSound === 'function') playSystemSound('success');
        alert(`✅ Đã xóa toàn bộ ${count} bản ghi KPI trong tháng ${currentMonth} thành công!`);
        calculateAndRenderTargets();
    } catch (e) {
        alert("Lỗi khi xóa KPI: " + e.message);
    }
};
window.deleteTargetSku = async function(skuCode) {
  const isConfirm = await window.showCustomConfirm("Xóa Chỉ Tiêu", "Bạn có chắc chắn muốn hủy giao chỉ tiêu mã sản phẩm này?", "fa-trash", "Xóa", "Hủy");
  if(!isConfirm) return;
  
 const safeCode = window._chiTieuTargetSalesCode.replace(/[\/\\]/g, '_');
const targetDocId = `tgt_${safeCode}_${window._chiTieuTargetMonth}`;
  try {
      const docRef = doc(db, "monthlyTargets", targetDocId);
      const snap = await getDoc(docRef);
      if(snap.exists()) {
          let items = snap.data().items || [];
          items = items.filter(i => i.skuCode !== skuCode);
          await setDoc(docRef, { items: items }, { merge: true });

      }
  } catch(e) { alert("Lỗi xóa chỉ tiêu: " + e.message); }
};
// Component thẻ tiến độ (BẢN PRO - CÓ CHỈ BÁO RUN-RATE & THỜI GIAN)
function buildProgressCard(title, icon, colorTheme, targetQty, actualQty, targetRev, actualRev, targetSkus = 0, actualSkus = 0) {
    let pct = targetRev > 0 ? (actualRev / targetRev) * 100 : (actualRev > 0 ? 100 : 0);
    
    // Tính toán tỷ lệ thời gian (Chỉ áp dụng nếu là tháng hiện tại)
    const now = new Date();
    const yyyy_mm_now = now.toISOString().slice(0, 7);
    const targetMonth = window._chiTieuTargetMonth || yyyy_mm_now;
    
    let timePct = 0;
    let daysLeft = 0;
    let runRateText = '';
    let timeWarningHtml = '';

    if (targetMonth === yyyy_mm_now) {
        const currentDay = now.getDate();
        const totalDaysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        timePct = (currentDay / totalDaysInMonth) * 100;
        daysLeft = totalDaysInMonth - currentDay;

        if (daysLeft > 0 && pct < 100 && targetRev > 0) {
            const revNeededPerDay = (targetRev - actualRev) / daysLeft;
            const qtyNeededPerDay = (targetQty - actualQty) / daysLeft;
            runRateText = `Cần bán: <b>${(revNeededPerDay/1000).toLocaleString('en-US')}k</b> hoặc <b>${qtyNeededPerDay.toFixed(1)} Thùng</b> / ngày để về đích.`;
            
            // Cảnh báo nếu tiến độ số < tiến độ thời gian
            if (pct < timePct - 5) {
                timeWarningHtml = `<div style="margin-top:8px; font-size:12px; color:var(--rose); background:rgba(225,29,72,0.1); padding:6px 10px; border-radius:6px; font-weight:700;"><i class="fa-solid fa-triangle-exclamation"></i> CẢNH BÁO: Tiến độ số (${pct.toFixed(1)}%) đang chạy chậm hơn tiến độ thời gian (${timePct.toFixed(1)}%). Cần tăng tốc!</div>`;
            } else {
                timeWarningHtml = `<div style="margin-top:8px; font-size:12px; color:var(--emerald); background:rgba(16,185,129,0.1); padding:6px 10px; border-radius:6px; font-weight:700;"><i class="fa-solid fa-fire"></i> TUYỆT VỜI: Tiến độ đang bám sát hoặc vượt thời gian! Duy trì nhé.</div>`;
            }
        } else if (pct >= 100) {
            runRateText = `Đã vượt chỉ tiêu sớm <b>${daysLeft}</b> ngày!`;
        }
    } else if (targetMonth < yyyy_mm_now) {
        timePct = 100;
        runRateText = `Tháng đã kết thúc.`;
    } else {
        runRateText = `Chưa đến tháng thực thi.`;
    }
    
    let statusColor = 'var(--rose)';
    let barGradient = 'var(--rose-gradient)';
    let bgTint = 'rgba(225, 29, 72, 0.05)';
    let iconBg = 'rgba(225, 29, 72, 0.1)';
    if(pct >= 100) { 
        statusColor = 'var(--emerald)'; 
        barGradient = 'var(--emerald-gradient)'; 
        bgTint = 'rgba(16, 185, 129, 0.05)';
        iconBg = 'rgba(16, 185, 129, 0.1)';
    }
    else if (pct >= 70) { 
        statusColor = 'var(--amber)'; 
        barGradient = 'var(--amber-gradient)'; 
        bgTint = 'rgba(245, 158, 11, 0.05)';
        iconBg = 'rgba(245, 158, 11, 0.1)';
    }

    const formatRev = (val) => ((Number(val) || 0) / 1000).toLocaleString('en-US');
    const formatQty = (val) => Number.isInteger(Number(val)) ? Number(val).toString() : Number(val).toFixed(1);

function findProductObj(skuCode) {
  if (!skuCode) return null;
  let clean = String(skuCode).trim().toUpperCase();
  let found = products.find(p => String(p.code || '').trim().toUpperCase() === clean || String(p.id || '').trim().toUpperCase() === clean);
  if (found) return found;
  
  let noDash = clean.replace(/[-_]/g, '');
  found = products.find(p => String(p.code || '').trim().toUpperCase().replace(/[-_]/g, '') === noDash);
  if (found) return found;

  found = products.find(p => {
      let pC = String(p.code || '').trim().toUpperCase();
      return clean.endsWith(pC) || pC.endsWith(clean);
  });
  return found || null;
}

window._cachedKpiOrders = {};
window._cachedKpiMonth = '';  
window.calculateAndRenderTargets = async function() {
  const container = document.getElementById('targetDashboardContainer');
  if (!container) return;

  try {
    const isAdminOrManager = currentUser.role === 'admin' || currentUser.role === 'manager';
    
    let globalTarget = 0; let globalActual = 0; 
    let salesTarget = 0; let salesActual = 0; 

    let globalRevTarget = 0; let globalRevActual = 0;
    let salesRevTarget = 0; let salesRevActual = 0;

    let targetItems = [];
    let companyRevenuesMap = {}; 

    let allTargetsMap = {}; 
    let globalGroupedData = {};
    let assignedSalesCodes = new Set(); 

    const qTargets = query(collection(db, "monthlyTargets"), where("month", "==", window._chiTieuTargetMonth), where("maDonVi", "==", window.currentWorkingTenant));
    const targetsSnap = await getDocs(qTargets);
    let targetDocFound = false;
    
    targetsSnap.forEach(doc => {
      const data = doc.data();
      if(data && data.month === window._chiTieuTargetMonth) {
        targetDocFound = true;
        const items = data.items || [];
        const revenues = data.companyRevenues || {};
        const sCode = data.salesCode;
        
        const hasItems = items && items.length > 0;
        const hasRevenues = revenues && Object.keys(revenues).length > 0;
        if (sCode && (hasItems || hasRevenues)) {
            assignedSalesCodes.add(sCode);
        }
        
        items.forEach(it => {
          if (!it) return;
          const t = Number(it.target || 0);
          globalTarget += t;
          allTargetsMap[`${sCode}_${it.skuCode}`] = true;
          
          const pObj = findProductObj(it.skuCode);
          const ratio = Number(pObj?.tyLeQuyDoi || 50);
          const itemPrice = Number(pObj?.price || 0);
          const calculatedTargetRev = t * ratio * itemPrice; 
          
          const cCode = it.compCode || 'KHAC';
          if (!globalGroupedData[cCode]) {
              globalGroupedData[cCode] = { compName: it.compName || cCode, compTarget: 0, compActual: 0, skusMap: {}, revTarget: 0, revActual: 0 };
          }
          globalGroupedData[cCode].compTarget += t;

          if (!globalGroupedData[cCode].skusMap[it.skuCode]) {
              globalGroupedData[cCode].skusMap[it.skuCode] = { code: it.skuCode, name: it.skuName || it.skuCode, target: 0, actual: 0, targetRev: 0, actualRev: 0 };
          }
          globalGroupedData[cCode].skusMap[it.skuCode].target += t;
          globalGroupedData[cCode].skusMap[it.skuCode].targetRev += calculatedTargetRev; 

          if (sCode === window._chiTieuTargetSalesCode) {
             salesTarget += t;
             targetItems.push(it);
          }
        });

        Object.keys(revenues).forEach(cCode => {
            const rt = Number(revenues[cCode].target || 0);
            globalRevTarget += rt;

            if (!globalGroupedData[cCode]) {
                globalGroupedData[cCode] = { compName: revenues[cCode].compName || cCode, compTarget: 0, compActual: 0, skusMap: {}, revTarget: 0, revActual: 0 };
            }
            globalGroupedData[cCode].revTarget += rt;

            if (sCode === window._chiTieuTargetSalesCode) {
                salesRevTarget += rt;
                companyRevenuesMap[cCode] = revenues[cCode];
            }
        });
      }
    });

    let actuals = {}; 
    let globalActualMap = {}; 
    let compActualRevenues = {}; 
    let salesOrderCountMap = {}; // Biến lưu đếm số đơn (Tính Drop Size)

  let monthlyOrdersForKpi = [];
    try {
        if (targetDocFound) { 
            const startOfMonth = window._chiTieuTargetMonth + "-01";
            const endOfMonth = window._chiTieuTargetMonth + "-31";
            
           if (window._cachedKpiMonth !== window._chiTieuTargetMonth) {
                // 1. ĐỌC TỪ Ổ CỨNG MÁY (INDEXEDDB) -> TỐN 0 READ SERVER DÙ CÓ ẤN F5
                let cachedData = await loadKpiOrdersFromLocal(window._chiTieuTargetMonth);
                
                if (cachedData && cachedData.length > 0) {
                    window._cachedKpiOrders[window._chiTieuTargetMonth] = cachedData;
                    window._cachedKpiMonth = window._chiTieuTargetMonth;
                } else {
                    // 2. CHỈ TẢI TỪ SERVER 1 LẦN DUY NHẤT KHI CÀI APP
                    const q = query(collection(db, "orders"), 
                        where("ngayCtu", ">=", startOfMonth), 
                        where("ngayCtu", "<=", endOfMonth)
                    );
                    const mSnap = await getDocs(q);
                    const data = mSnap.docs.map(d => d.data());
                    
                    window._cachedKpiOrders[window._chiTieuTargetMonth] = data;
                    window._cachedKpiMonth = window._chiTieuTargetMonth;
                    
                    // Lưu ngay vào ổ cứng để vĩnh viễn không bị kéo lại
                    await saveKpiOrdersToLocal(window._chiTieuTargetMonth, data);
                    localStorage.setItem(`dms_kpi_last_sync_${window._chiTieuTargetMonth}`, new Date().toISOString());
                }
            }
            
            let allMonthOrders = window._cachedKpiOrders[window._chiTieuTargetMonth] || [];
            
            if (window._chiTieuTargetSalesCode && window._chiTieuTargetSalesCode !== 'ALL') {
                monthlyOrdersForKpi = allMonthOrders.filter(o => o.salesCode === window._chiTieuTargetSalesCode);
            } else {
                monthlyOrdersForKpi = allMonthOrders;
            }
        }
    } catch(e) {
        console.warn("Lỗi tải dữ liệu KPI: ", e);
        monthlyOrdersForKpi = typeof orders !== 'undefined' ? orders : [];
    }
    if (Array.isArray(monthlyOrdersForKpi)) {
      monthlyOrdersForKpi.forEach(o => {
        if (o && o.status !== 'Đã hủy' && o.ngayCtu && o.ngayCtu.startsWith(window._chiTieuTargetMonth)) {
          
          // Đếm số đơn (Drop Size)
          if (!salesOrderCountMap[o.salesCode]) salesOrderCountMap[o.salesCode] = new Set();
          salesOrderCountMap[o.salesCode].add(o.id || o.soCtu || o.orderId);

          if (assignedSalesCodes.has(o.salesCode)) {
            if (Array.isArray(o.items)) {
              let orderRevByComp = {};

              o.items.forEach(item => {
                if (!item) return;
                const pObj = findProductObj(item.code || item.id);
                const ratio = Number(pObj?.tyLeQuyDoi || item.tyLeQuyDoi || 50);
                const qtyThung = Number(item.qty || 0) / (ratio > 0 ? ratio : 50);
                const skuKey = String(item.code || item.id || '').toUpperCase();

                const itemPrice = Number(item.price || pObj?.price || 0);
                const itemRev = Number(item.qty || 0) * itemPrice;
                
                const compCode = getCompCodeFromProductCode(skuKey);
                orderRevByComp[compCode] = (orderRevByComp[compCode] || 0) + itemRev;
                
                let isTargetedGlobally = false;
                if (globalGroupedData[compCode] && (globalGroupedData[compCode].compTarget > 0 || globalGroupedData[compCode].revTarget > 0)) {
                    isTargetedGlobally = true;
                }
                
                if (isTargetedGlobally) {
                    globalActual += qtyThung;
                    globalRevActual += itemRev; 
                }
                
                globalActualMap[`${o.salesCode}_${skuKey}`] = (globalActualMap[`${o.salesCode}_${skuKey}`] || 0) + qtyThung;

                if (globalGroupedData[compCode]) {
                    globalGroupedData[compCode].compActual += qtyThung;
                    globalGroupedData[compCode].revActual += itemRev;
                    if (globalGroupedData[compCode].skusMap[skuKey]) {
                        globalGroupedData[compCode].skusMap[skuKey].actual += qtyThung;
                        globalGroupedData[compCode].skusMap[skuKey].actualRev += itemRev;
                    } else {
                        globalGroupedData[compCode].skusMap[skuKey] = {
                            code: skuKey,
                            name: item.name || skuKey,
                            target: 0,
                            actual: qtyThung,
                            targetRev: 0,
                            actualRev: itemRev
                        };
                    }
                } else {
                    let foundComp = typeof companyList !== 'undefined' ? companyList.find(c => String(c.maCtu || '').trim().toUpperCase() === compCode) : null;
                    globalGroupedData[compCode] = {
                        compName: foundComp ? foundComp.tenCtu : `Công Ty ${compCode}`,
                        compTarget: 0,
                        compActual: qtyThung,
                        skusMap: {
                            [skuKey]: { code: skuKey, name: item.name || skuKey, target: 0, actual: qtyThung, targetRev: 0, actualRev: itemRev }
                        },
                        revTarget: 0,
                        revActual: itemRev
                    };
                }
                
                if (o.salesCode === window._chiTieuTargetSalesCode) {
                    let isTargetedForSales = false;
                    if (companyRevenuesMap[compCode] && Number(companyRevenuesMap[compCode].target) > 0) isTargetedForSales = true;
                    if (allTargetsMap[`${o.salesCode}_${skuKey}`]) isTargetedForSales = true;

                    if (isTargetedForSales) {
                        actuals[skuKey] = (actuals[skuKey] || 0) + qtyThung;
                        salesActual += qtyThung;
                        salesRevActual += itemRev; 
                    }
                }
              });

              Object.keys(orderRevByComp).forEach(cCode => {
                 const rev = orderRevByComp[cCode];
                 if (o.salesCode === window._chiTieuTargetSalesCode) {
                     compActualRevenues[cCode] = (compActualRevenues[cCode] || 0) + rev;
                 }
              });
            }
          }
        }
      });
    }

    let globalTargetSkusCount = Object.keys(allTargetsMap).length;
    let globalActualSkusCount = Object.values(globalActualMap).filter(v => v > 0).length;

    let personalTargetSkusCount = targetItems.length;
    let personalActualSkusCount = targetItems.filter(it => (actuals[it.skuCode] || 0) > 0).length;

    let grouped = {};
    targetItems.forEach(it => {
        if (!it) return;
        if(!grouped[it.compCode]) {
           grouped[it.compCode] = { compName: it.compName || it.compCode, compTarget: 0, compActual: 0, skus: [], revTarget: 0, revActual: 0 };
        }
        let act = actuals[it.skuCode] || 0;
        grouped[it.compCode].compTarget += it.target;
        grouped[it.compCode].compActual += act;
        
        const pObj = findProductObj(it.skuCode);
        const ratio = Number(pObj?.tyLeQuyDoi || 50);
        const itemPrice = Number(pObj?.price || 0);

        grouped[it.compCode].skus.push({
          code: it.skuCode, 
          name: it.skuName || it.skuCode, 
          target: it.target, 
          actual: act, 
          createdByUid: it.createdByUid,
          targetRev: (it.target * ratio * itemPrice),

window.deleteCtkm = async function(id) {
  if (currentUser.role !== 'admin' && currentUser.role !== 'manager') return;
  const confirmDel = await window.showCustomConfirm("Xóa CTKM", "Bạn có chắc chắn muốn xóa chương trình này?", "fa-trash", "Xóa", "Hủy");
  if (!confirmDel) return;

  try {
    await deleteDoc(doc(db, "promotions", id));
    window.promotionsList = window.promotionsList.filter(p => p.id !== id);
    window.debounceFilterCtkm(window._ctkmSearchKey);
  } catch (err) {
    alert("Lỗi xóa CTKM: " + err.message);
  }
};

window.exportCtkmExcel = function() {
  if (currentUser.role !== 'admin' && currentUser.role !== 'manager') return;
  if (!window.promotionsList || window.promotionsList.length === 0) return alert("Không có dữ liệu CTKM!");

 // Mapping đúng 100% với file ctkm.xlsx chuẩn
      const dataToExport = window.promotionsList.map(p => ({
        "Ma CTKM": p.maKM || '',
        "Tu Ngay": p.tuNgay || '',
        "Den Ngay": p.denNgay || '',
        "Ma Ctu": p.maCtu || '',
        "Noi Dung": p.noiDung || '',
        "Nhom Hang Hoa": p.hangHoa || '',
        "Khach Hang": p.khachHang || ''
      }));

  const worksheet = XLSX.utils.json_to_sheet(dataToExport);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "KhuyenMai");
  XLSX.writeFile(workbook, `CTKM_XuatRa_${new Date().toISOString().slice(0, 10)}.xlsx`);
};

window.triggerImportCtkmExcel = function() {
  document.getElementById('ctkmFileInput').click();
};

window.handleImportCtkmExcel = function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        // CẤU HÌNH cellDates: true ĐỂ NHẬN DIỆN NGÀY THÁNG TỪ EXCEL
        const workbook = XLSX.read(data, { type: 'array', cellDates: true }); 
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        
        // CẤU HÌNH raw: false ĐỂ ÉP EXCEL XUẤT RA CHUỖI ĐÃ FORMAT THAY VÌ SỐ SERIAL (45962)
        const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false, dateNF: "dd/mm/yyyy" }); 

        if (!jsonRows || jsonRows.length === 0) return alert("File Excel rỗng!");

        // Tự động quét tìm dòng chứa tiêu đề "Ma CTKM"
        let headerIdx = -1;
        for (let i = 0; i < 20; i++) {
           if (jsonRows[i] && jsonRows[i].some(cell => String(cell).includes('Ma CTKM'))) {
               headerIdx = i; break;
           }
        }

        if (headerIdx === -1) {
            return alert("Lỗi: Không tìm thấy dòng tiêu đề chứa chữ 'Ma CTKM' trong file!");
        }

        const headers = jsonRows[headerIdx];
        const colMap = {};
        headers.forEach((h, i) => { if (h) colMap[String(h).trim()] = i; });

        let newPromos = [];
        let importedCtus = new Set();

        // Hàm tiện ích cắt bỏ đuôi 00:00:00 nếu Excel tự thêm vào
        const formatCleanDate = (val) => {
            if (!val) return '';
            return String(val).split(' ')[0].trim();
        };

        // Bắt đầu đọc từ dòng dưới dòng tiêu đề
        for (let i = headerIdx + 1; i < jsonRows.length; i++) {
            const row = jsonRows[i];
            if (!row || row.length === 0 || !row[colMap['Ma CTKM']]) continue;
            
            const ctu = row[colMap['Ma Ctu']] ? String(row[colMap['Ma Ctu']]).trim() : 'KHÁC';
            importedCtus.add(ctu);

            newPromos.push({
               id: 'km_' + Date.now() + '_' + i,
               maDonVi: window.currentWorkingTenant,
               tuNgay: formatCleanDate(row[colMap['Tu Ngay']]),
               denNgay: formatCleanDate(row[colMap['Den Ngay']]),
               maKM: String(row[colMap['Ma CTKM']]).trim(),
               noiDung: row[colMap['Noi Dung']] ? String(row[colMap['Noi Dung']]).trim() : '',
               hangHoa: row[colMap['Nhom Hang Hoa']] ? String(row[colMap['Nhom Hang Hoa']]).trim() : '',
               khachHang: row[colMap['Khach Hang']] ? String(row[colMap['Khach Hang']]).trim() : '',
               maCtu: ctu,
               createdAt: new Date().toISOString()
            });
        }

        if (newPromos.length === 0) return alert("Không đọc được dòng dữ liệu hợp lệ nào!");

        // Hiển thị Modal để hỏi Chế độ nhập
        window._tempImportedPromos = newPromos;
        window._tempImportedCtus = Array.from(importedCtus);
        
        const modalContainer = document.getElementById('dynamicModalContainer');
        modalContainer.innerHTML = `
          <div class="modal" style="display:flex; z-index:999999;">
            <div class="modal-content" style="max-width: 450px; padding: 24px; border-radius: 18px; text-align:center;">
              <div style="font-size:36px; color:var(--amber); margin-bottom:16px;"><i class="fa-solid fa-file-import"></i></div>
              <h3 style="font-size:18px; font-weight:900; color:var(--text-main); margin-bottom:8px;">Tải Lên ${newPromos.length} Chương Trình</h3>
              <p style="font-size:14px; color:var(--text-muted); margin-bottom:20px; line-height:1.5;">Hệ thống phát hiện các mã Công ty (MaCtu): <b style="color:var(--primary);">${window._tempImportedCtus.join(', ')}</b>. Bạn muốn lưu dữ liệu theo chế độ nào?</p>
              
              <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="btn btn-amber" style="padding:14px; font-size:14px; font-weight:800; justify-content:center; border-radius:10px;" onclick="executeImportCtkm('replace_ctu')">
                  <i class="fa-solid fa-object-group"></i> 1. CHỈ GHI ĐÈ CÁC CÔNG TY TRONG FILE
                </button>
                <button class="btn btn-red" style="padding:14px; font-size:14px; font-weight:800; justify-content:center; border-radius:10px;" onclick="executeImportCtkm('replace_all')">
                  <i class="fa-solid fa-dumpster-fire"></i> 2. XÓA TOÀN BỘ CŨ & THAY MỚI 100%
                </button>
                <button class="btn" style="padding:14px; font-size:14px; font-weight:800; justify-content:center; border-radius:10px; margin-top:8px; background:var(--card-border);" onclick="document.getElementById('dynamicModalContainer').classList.add('hidden')">
                  HỦY BỎ
                </button>
              </div>
            </div>
          </div>
        `;
        modalContainer.classList.remove('hidden');
        
        document.getElementById('ctkmFileInput').value = '';
      } catch (err) {
        alert("Lỗi khi đọc file Excel: " + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  };

window.executeImportCtkm = async function(mode) {
  const newPromos = window._tempImportedPromos;
  const targetCtus = window._tempImportedCtus;
  
  const modalContainer = document.getElementById('dynamicModalContainer');
  modalContainer.innerHTML = `<div class="modal" style="display:flex; z-index:999999;"><div style="color:#fff; font-size:18px; font-weight:bold;"><i class="fa-solid fa-spinner fa-spin"></i> Đang đồng bộ lên máy chủ...</div></div>`;

  try {
    const qPromoDelete = query(collection(db, "promotions"), where("maDonVi", "==", window.currentWorkingTenant));
    const promoSnap = await getDocs(qPromoDelete);
    let batches = [];
    let currentBatch = writeBatch(db);
    let count = 0;

    promoSnap.forEach((docSnap) => {
      const data = docSnap.data();
      // Nếu chế độ 2 (Chỉ ghi đè công ty) -> Kiểm tra maCtu có nằm trong file Excel không
      if (mode === 'replace_all' || (mode === 'replace_ctu' && targetCtus.includes(data.maCtu))) {
         currentBatch.delete(docSnap.ref);
         count++;
      }
      if (count >= 400) {
        batches.push(currentBatch.commit());
        currentBatch = writeBatch(db);
        count = 0;
      }
    });
    if (count > 0) batches.push(currentBatch.commit());
    await Promise.all(batches);

    // Đẩy danh sách mới lên
    let uploadBatches = [];
    let uploadBatch = writeBatch(db);
    let upCount = 0;

    newPromos.forEach(p => {
      const docRef = doc(collection(db, "promotions"), p.id);
      uploadBatch.set(docRef, p);
      upCount++;
      if (upCount >= 400) {
        uploadBatches.push(uploadBatch.commit());
        uploadBatch = writeBatch(db);
        upCount = 0;
      }
    });
    if (upCount > 0) uploadBatches.push(uploadBatch.commit());
    await Promise.all(uploadBatches);

// Cập nhật Local UI
    if (mode === 'replace_all') {
       window.promotionsList = newPromos;
    } else {
       window.promotionsList = window.promotionsList.filter(p => !targetCtus.includes(p.maCtu));
       window.promotionsList = [...window.promotionsList, ...newPromos];
    }

    modalContainer.classList.add('hidden');
    
    // GỌI LẠI HÀM SWITCH TAB ĐỂ VẼ LẠI GIAO DIỆN (Cách này an toàn nhất không bị báo lỗi function)
    window._ctkmSearchKey = '';
    if (typeof switchTab === 'function') {
        switchTab('ctkm'); 
    }

    if (typeof playSystemSound === 'function') playSystemSound('success');
    alert("✅ Tải dữ liệu Khuyến Mãi thành công!");

  } catch(e) {
    modalContainer.classList.add('hidden');
    alert("Lỗi khi tải dữ liệu lên Firebase: " + e.message);
  }
};
  // 1. Mở Modal chọn nguồn nhân bản

                </div>

                <div style="background: rgba(245,158,11,0.08); padding: 12px; border-radius: 12px; border: 1px dashed var(--amber); margin-bottom: 20px;">
                    <label style="font-size:12px; font-weight:900; color:var(--amber); display:block; margin-bottom:6px;">Tùy chọn hệ số tăng trưởng (%):</label>

                        <span style="font-size:12px; color:var(--text-muted); font-weight:700;">% (VD: 10 nghĩa là tăng 10% chỉ tiêu tháng mới)</span>
